<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플 코멘트 — 리스트 / A4 확인서 시안</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#F5F1E6;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#1f2937}
.note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.7;margin-bottom:14px}

.split{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}.sl{position:static;max-height:none}}

/* ── 왼쪽 리스트 ── */
.sl{background:#fff;border:2px solid #0B0A05;overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.slbar{padding:9px 10px;border-bottom:1px solid #e3e7ec;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fafbfc}
.slbar select{font-family:inherit;font-size:12px;font-weight:600;border:1px solid #d7dce2;border-radius:6px;padding:5px 7px;background:#fff;color:#1f2937}
.slbar label{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer}
.slstat{display:flex;gap:8px;padding:7px 11px;border-bottom:1px solid #e3e7ec;font-size:11.5px;color:#6b7280}
.slstat b{color:#1f2937;font-weight:800;margin-right:2px}
.slist{overflow:auto;flex:1}
.row{padding:10px 12px;border-bottom:1px solid #eef1f5;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 8px}
.row:hover{background:#f7f9fb}
.row.on{background:#eef4fb;box-shadow:inset 3px 0 0 #1f2937}
.row .nm{grid-column:1;grid-row:1;font-size:13.5px;font-weight:800;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .sub{grid-column:1;grid-row:2;font-size:11.5px;color:#8b95a1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .rt{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px}
.chip{font-size:10.5px;font-weight:800;border-radius:100px;padding:2px 8px;white-space:nowrap;border:1px solid transparent}
.chip.rd{background:#f1f3f5;color:#374151}
.chip.fix{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.chip.ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}

/* ── 오른쪽: 화면 전용 조작줄 + A4 시트 ── */
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctl .lb{font-size:11.5px;font-weight:800;color:#6b7280}
.rtab{font-size:12.5px;font-weight:700;border:1px solid #d7dce2;background:#fff;border-radius:100px;padding:5px 13px;cursor:pointer;font-family:inherit;color:#4b5563}
.rtab.on{background:#1f2937;border-color:#1f2937;color:#fff}
.rtab.add{border-style:dashed;color:#5b7699}
.btn{font-family:inherit;font-size:12px;font-weight:700;border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:5px 11px;cursor:pointer;color:#374151}
.btn.gr{background:#047857;border-color:#047857;color:#fff}
.sp{flex:1}
.over{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:12px;font-weight:700;border-radius:7px;padding:6px 11px;margin-bottom:8px}
.over.on{display:block}

/* ⚠️ 작지(tp-wrap)와 **똑같은 방식** — 새로 만들지 않는다.
   · 종이 = 200×287mm (@page margin 3mm. 작지가 이 값으로 인쇄 잘 나옴)
   · 1단계 fitContent(): 내용이 종이보다 길면 **내용만** 축소 → 종이 밖으로 안 넘침
   · 2단계 fitScreen():  종이 전체를 화면 남은 **가로·세로**에 맞춰 축소 → 스크롤 없이 한눈에 */
.a4wrap{width:100%;overflow:hidden}
.a4{width:200mm;height:287mm;background:#fff;border:2px solid #374151;display:flex;flex-direction:column;overflow:hidden;
  transform-origin:top left;box-shadow:0 2px 10px rgba(0,0,0,.10)}
.a4 .fit{flex:1;display:flex;flex-direction:column;width:100%;min-height:0;transform-origin:top left}
.a4mark{font-size:11px;color:#8b95a1;margin:6px 0 0;font-weight:600}
@media print{
  @page{size:A4 portrait;margin:3mm}
  body{padding:0;background:#fff}
  .note,.split>.sl,.ctl,.over,.a4mark{display:none!important}
  .split{display:block}
  .a4wrap{overflow:visible}
  .a4{transform:none!important;border:0;box-shadow:none}
}

.htop{display:grid;grid-template-columns:88px 1fr auto;border-bottom:1px solid #2c3e50;flex:0 0 auto}
.logo{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;font-style:italic;border-right:1px solid #2c3e50;letter-spacing:-.5px}
.ttl{display:flex;align-items:baseline;gap:7px;padding:9px 11px;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;min-width:0}
.ttl .pfx{color:#5b7699}
.ttl .rd{background:#1f2937;color:#fff;font-size:11px;font-weight:800;border-radius:100px;padding:2px 8px}
.ttl .nm{overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:11px;color:#8b95a1;font-weight:500}
.who{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;border-left:1px solid #2c3e50}
.who .h{background:#f3f5f8;padding:0 8px;height:100%;display:flex;align-items:center;font-size:11px;font-weight:700;border-right:1px solid #dfe3e8;border-left:1px solid #dfe3e8}
.who div:not(.h){padding:0 9px;font-size:12px;font-weight:600;white-space:nowrap}

table.meta{width:100%;border-collapse:collapse;flex:0 0 auto}
table.meta th{background:#f3f5f8;font-size:11.5px;font-weight:700;padding:6px 8px;border:1px solid #dfe3e8;white-space:nowrap}
table.meta td{font-size:12.5px;font-weight:600;padding:6px 9px;border:1px solid #dfe3e8}

.sec{background:#eef1f5;border-top:1px solid #2c3e50;border-bottom:1px solid #dfe3e8;padding:5px 12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sec .hint{font-weight:400;font-size:10.5px;color:#8b95a1;margin-left:auto}

/* 남는 높이는 코멘트와 사진이 나눠 갖는다 → 종이 아래쪽에 빈 여백이 안 남음 */
.cmt{padding:8px 11px;flex:1 1 34%;min-height:0;display:flex}
.cmt textarea{width:100%;height:100%;min-height:64px;border:1px solid #cfd6de;border-radius:3px;padding:8px 10px;font-family:inherit;font-size:12.5px;line-height:1.65;resize:none;outline:0}
.cmt textarea:focus{border-color:#5b7699}

.matrow{padding:6px 12px;border-bottom:1px solid #eef1f5;line-height:1.5;flex:0 0 auto}
.matrow:last-of-type{border-bottom:0}
.matrow .n1{font-size:12.5px;font-weight:800}
.matrow .n1 em{font-style:normal;font-weight:500;color:#8b95a1;font-size:11px}
.matrow .n2{font-size:11.5px;color:#5b6570}
.matrow .n2 b{color:#1d4ed8;font-weight:700}

table.sz{width:100%;border-collapse:collapse;flex:0 0 auto}
table.sz th{background:#f3f5f8;font-size:11px;font-weight:800;padding:5px 4px;border:1px solid #cfd6de}
table.sz td{font-size:13px;padding:0;border:1px solid #cfd6de;text-align:center;height:28px}
table.sz td.rl{text-align:left;padding:0;background:#fafbfc}
table.sz input{width:100%;height:26px;border:0;background:transparent;text-align:center;font-family:inherit;font-size:13px;font-weight:600;color:#1f2937;outline:0}
table.sz td.rl input{text-align:left;padding:0 9px;font-weight:700}
table.sz input:focus{background:#fff8e1}
.diff{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.diff.plus{color:#c2410c}.diff.minus{color:#1d4ed8}.diff.zero{color:#9aa3ad}
table.sz tr.wt td{background:#fafbfc}
table.sz tr.wt td.rl{font-weight:800;padding:0 9px}
.rowx{color:#c9ced6;cursor:pointer;font-size:13px;border:0;background:none;width:100%}
.addrow{display:block;width:100%;padding:5px;border:0;border-top:1px dashed #c9d2dc;background:#fbfcfd;color:#5b7699;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto}

/* 사진 = 맨 밑, 남는 높이를 씀 */
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 11px;flex:1 1 66%;min-height:0}
.pic{border:1px solid #d7dce2;border-radius:3px;background:#fafbfc;display:flex;align-items:center;justify-content:center;position:relative;color:#a9b2bc;font-size:11px;cursor:pointer;overflow:hidden;min-height:0}
.pic:hover{border-color:#5b7699;background:#f3f6f9}
.pic .tag{position:absolute;left:4px;top:4px;background:#0B0A05;color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:3px}
</style></head><body>

<div class="note"><b>샘플 코멘트 — 새 구조 시안</b> · 왼쪽 리스트를 누르면 오른쪽이 바뀝니다. 오른쪽은 <b>작지와 같은 방식</b>으로 A4(200×287mm)에 맞춰 축소돼서 화면에 한 장이 통째로 들어가고, 인쇄하면 A4에 정확히 나옵니다. <b>사진은 맨 밑</b>. 「실측」을 넣으면 차이가 자동 계산돼요.</div>

<div class="split">
  <div class="sl">
    <div class="slbar">
      <select><option>전체 시즌</option><option>26FW</option></select>
      <select><option>전체 브랜드</option><option>더프루토</option></select>
      <select><option>최근 순</option><option>수정 많은 순</option><option>이름 순</option></select>
      <label><input type="checkbox">수정필요만</label>
    </div>
    <div class="slstat"><span><b>4</b>아이템</span><span><b>6</b>적은 회차</span><span style="color:#b91c1c"><b>3</b>수정필요</span></div>
    <div class="slist" id="slist"></div>
  </div>

  <div>
    <div class="ctl" id="ctl"></div>
    <div class="over" id="over">⚠ 내용이 너무 많아 글씨가 심하게 작아집니다 — 부위나 코멘트를 줄여주세요</div>
    <div class="a4wrap" id="a4wrap"><div class="a4" id="a4"></div></div>
    <div class="a4mark" id="a4mark"></div>
  </div>
</div>

<script>
var DATA=[
 {id:'a',nm:'유아 백팩 가방',bn:'더프루토',cd:'TF39',cl:'크림',sz:'FREE',fix:1,
  rs:[{n:2,date:'2026-08-21',done:false,cmt:''},
      {n:1,date:'2026-08-19',done:false,cmt:'자수 위치 제대로 안나옴, 단추 모양 제대로 안나옴\n공장에서 랍빠 폭 7mm로 햇다고함 — 랍빠 21골 골덴으로 바꿔달라고함. 어깨끈 얇아질까봐 걱정.'}]},
 {id:'b',nm:'후리스 팬츠',bn:'더프루토',cd:'TF45',cl:'아이보리',sz:'FREE',fix:1,
  rs:[{n:1,date:'2026-08-19',done:false,cmt:'샘플 다시'}]},
 {id:'c',nm:'거즈 이불 불가사리 블랭킷',bn:'더프루토',cd:'TF51',cl:'크림',sz:'FREE',fix:0,
  rs:[{n:2,date:'2026-08-18',done:true,cmt:''}]},
 {id:'d',nm:'포켓가방',bn:'더프루토',cd:'TF38',cl:'그린',sz:'FREE',fix:1,
  rs:[{n:1,date:'2026-08-17',done:false,cmt:'후다 길이 길게 바꾸기'}]}
];
var SPEC=[['후드높이','42','42','42'],['후드 밑단넓이','20','20','20.5'],['후드 머리넓이','21','21','22'],
          ['후드 입구','19','19','18.5'],['머플러 길이','85','85','84.7'],['머플러 넓이','17','17','17']];
var PICS=[['front','앞'],['back','뒤'],['lining','안감'],['detail','디테일']];
var cur='a', curR=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function md(iso){var p=String(iso||'').split('-');return p.length===3?((+p[1])+'/'+(+p[2])):'';}
function D(){return DATA.filter(function(x){return x.id===cur;})[0];}

function renderList(){
  document.getElementById('slist').innerHTML=DATA.map(function(d){
    var r0=d.rs[0]||{};
    return '<div class="row'+(d.id===cur?' on':'')+'" onclick="pick(\''+d.id+'\')">'
      +'<div class="nm">'+esc(d.nm)+'</div><div class="sub">'+esc(d.bn)+' · '+esc(d.cd)+'</div>'
      +'<div class="rt"><span class="chip rd">'+(r0.n||1)+'차 '+md(r0.date)+'</span>'
      +(d.fix?('<span class="chip fix">수정 '+d.fix+'</span>'):'<span class="chip ok">확인됨</span>')+'</div></div>';
  }).join('');
}
function pick(id){cur=id;curR=0;render();}
function pickR(i){curR=i;render();}

function render(){
  renderList();
  var d=D(), rr=d.rs[curR]||{};
  document.getElementById('ctl').innerHTML='<span class="lb">회차</span>'
    + d.rs.map(function(r,i){return '<button class="rtab'+(i===curR?' on':'')+'" onclick="pickR('+i+')">'+(r.n||i+1)+'차 '+md(r.date)+'</button>';}).join('')
    + '<button class="rtab add">＋ 회차</button>'
    + '<button class="btn'+(rr.done?' gr':'')+'" style="margin-left:6px">'+(rr.done?'확인됨':'수정필요')+'</button>'
    + '<span class="sp"></span><button class="btn">텍스트 복사</button><button class="btn gr">A4 인쇄 · 이미지</button>';

  var H='<div class="htop"><div class="logo">Arude</div>'
    +'<div class="ttl"><span class="pfx">샘플확인서</span><span class="rd">'+(rr.n||curR+1)+'차</span><span class="nm">'+esc(d.nm)+'</span><span class="sub">/ '+esc(d.bn)+' · '+esc(d.cd)+'</span></div>'
    +'<div class="who"><div class="h">담당자</div><div>박수빈</div><div class="h">확인일</div><div>'+esc(rr.date||'')+'</div></div></div>';
  H+='<table class="meta"><tr><th style="width:50px">브랜드</th><td style="width:72px">'+esc(d.bn)+'</td>'
    +'<th style="width:42px">품명</th><td>'+esc(d.nm)+'</td>'
    +'<th style="width:42px">컬러</th><td style="width:70px">'+esc(d.cl)+'</td>'
    +'<th style="width:48px">사이즈</th><td style="width:50px">'+esc(d.sz)+'</td></tr></table>';

  H+='<div class="fit">';
  H+='<div class="sec">코멘트</div><div class="cmt"><textarea placeholder="샘플 확인 내용 · 수정 요청 · 전달사항">'+esc(rr.cmt||'')+'</textarea></div>';
  H+='<div class="sec">원단 <span class="hint">아이템에서 자동 · 원단만</span></div>'
    +'<div class="matrow"><div class="n1">몸판 / 거즈 3중지 <em>(예농)</em></div><div class="n2">C100 · 요척 <b>1.16</b> · #301 내추럴에 프린트</div></div>'
    +'<div class="matrow"><div class="n1">안감 / 위버플러스 <em>(메이드)</em></div><div class="n2">요척 <b>0.5</b></div></div>';
  H+='<div class="sec">사이즈 체크리스트 <span class="hint">차이 = 실측 − 지시 (자동)</span></div>'
    +'<table class="sz" id="tbl"><tr><th style="width:32%">측정부위</th><th style="width:14%">패턴</th>'
    +'<th style="width:16%">지시</th><th style="width:16%">실측</th><th style="width:14%">차이</th><th style="width:24px"></th></tr></table>'
    +'<button class="addrow" onclick="addRow(\'\',\'\',\'\',\'\')">＋ 부위 추가</button>';
  H+='<div class="sec">사진 <span class="hint">클릭 · 끌어다 놓기 · 붙여넣기(Ctrl+V)</span></div>'
    +'<div class="pics">'+PICS.map(function(p){return '<div class="pic">＋ 사진<span class="tag">'+p[1]+'</span></div>';}).join('')+'</div>';
  H+='</div>';

  document.getElementById('a4').innerHTML=H;
  SPEC.forEach(function(s){addRow(s[0],s[1],s[2],curR===0?'':s[3]);});
  var t=document.getElementById('tbl');
  var w=document.createElement('tr'); w.className='wt';
  w.innerHTML='<td class="rl">공임</td><td colspan="4"><input value="12,000" placeholder="자동"></td><td></td>';
  t.appendChild(w);
  checkOver();
}
/* 1단계 — 내용이 종이보다 길면 내용만 축소 (작지 tpFit 과 같은 식) */
function fitContent(){
  var f=document.querySelector('#a4 .fit'); if(!f)return 1;
  f.style.transform=''; f.style.width='100%';
  var ch=f.clientHeight, sh=f.scrollHeight;
  if(sh>ch+2){ var sc=ch/sh; if(sc>0&&sc<1){ f.style.transform='scale('+sc+')'; f.style.width=(100/sc)+'%'; return sc; } }
  return 1;
}
/* 2단계 — 종이 전체를 화면 남은 가로·세로에 맞춰 축소 (작지 tpScreenFit 과 같은 식) */
function fitScreen(availHTest){
  var wrap=document.getElementById('a4wrap'), a=document.getElementById('a4');
  if(!wrap||!a)return 1;
  a.style.transform='';
  var pw=a.offsetWidth, ph=a.offsetHeight;
  /* ⚠️ window.innerHeight 가 0 으로 잡히는 창이 있다 → 못 재면 세로 제한을 안 건다 */
  var vh=document.documentElement.clientHeight||window.innerHeight||0;
  var top=wrap.getBoundingClientRect().top;
  var availW=wrap.clientWidth||pw;
  var availH=(availHTest!=null)?availHTest:(vh?(vh-top-24):0);
  var sW=availW>0?(availW/pw):1;
  var sH=(availH>80)?(availH/ph):1;
  var s=Math.min(1, sW, sH);
  s=Math.floor(s*1000)/1000;
  if(!(s>0))s=1;
  if(s<1){ a.style.transform='scale('+s+')'; wrap.style.height=Math.ceil(ph*s)+'px'; }
  else { wrap.style.height=ph+'px'; }
  return s;
}
function fitA4(){
  var cs=fitContent(), ss=fitScreen();
  var a=document.getElementById('a4'), m=document.getElementById('a4mark');
  if(m)m.textContent='종이 200×287mm ('+a.offsetWidth+'×'+a.offsetHeight+'px) · 화면 '+Math.round(ss*100)+'%'
    +(cs<1?(' · 내용 '+Math.round(cs*100)+'%로 줄여 넣음'):' · 내용 그대로');
}
function checkOver(){
  fitA4();
  var f=document.querySelector('#a4 .fit');
  document.getElementById('over').classList.toggle('on', !!(f&&f.scrollHeight>f.clientHeight*1.6));
}
window.addEventListener('resize',fitA4);
function calc(tr){
  var i=tr.querySelectorAll('input');
  var g=parseFloat(i[2].value), m=parseFloat(i[3].value), el=tr.querySelector('.diff');
  if(i[2].value===''||i[3].value===''||isNaN(g)||isNaN(m)){el.textContent='';el.className='diff';return;}
  var v=Math.round((m-g)*100)/100;
  el.textContent=(v>0?'+':'')+v;
  el.className='diff '+(v>0?'plus':(v<0?'minus':'zero'));
}
function addRow(part,pat,give,meas){
  var t=document.getElementById('tbl'); if(!t)return;
  var tr=document.createElement('tr');
  tr.innerHTML='<td class="rl"><input value="'+esc(part)+'" placeholder="측정부위"></td>'
    +'<td><input value="'+esc(pat)+'"></td><td><input value="'+esc(give)+'"></td>'
    +'<td><input value="'+esc(meas)+'"></td><td><span class="diff"></span></td>'
    +'<td><button class="rowx" onclick="this.closest(\'tr\').remove();checkOver()">×</button></td>';
  t.appendChild(tr);
  tr.querySelectorAll('input').forEach(function(x){x.addEventListener('input',function(){calc(tr);});});
  calc(tr); checkOver();
}
render();
</script>
</body></html>
