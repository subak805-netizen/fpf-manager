<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>FPF 동기화 검사</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;margin:16px;background:#f6f6f3;color:#16150f}
h1{font-size:18px;margin:0 0 8px}
#res{border-collapse:collapse;font-size:13px;margin:10px 0}
#res td,#res th{border:1px solid #ccc;padding:4px 8px;text-align:left;vertical-align:top}
.pass{color:#1c7045;font-weight:700}.fail{color:#b5301f;font-weight:700}.weak{color:#8f5c0c;font-weight:700}
#frames iframe{width:520px;height:360px;border:1px solid #999;margin:4px;background:#fff}
#log{font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;background:#fff;border:1px solid #ddd;padding:6px}
</style></head><body>
<h1>FPF 동기화 검사 — 가짜 기기 두 대</h1>
<div id="status">준비 중…</div>
<table id="res"><tr><th>#</th><th>장면</th><th>결과</th><th>걸린 시간</th><th>자세히</th></tr></table>
<div id="frames"></div>
<div id="log"></div>
<script>
/* ===== 동기화 검사 러너 (2026-09-28) =====
   - 가짜 구글 창고(CLOUD.docs) 하나를 들고, 가짜 기기(iframe, 기기마다 다른 주소 = 따로 저장소)들이 여기에 읽고 쓴다.
   - 창고는 «늦게 도착한 쓰기가 이긴다»(진짜 Firestore 와 같음). 다른 기기에는 바뀐 문서를 실시간으로 알린다.
   - 장면마다 새 창고·새 기기 주소로 시작(서로 안 섞임). 결과는 표 + /result 로 보낸다. */
var PORT=location.port, Q={}; location.search.replace(/^\?/,'').split('&').forEach(function(p){ if(p){ var i=p.indexOf('='); Q[p.slice(0,i<0?p.length:i)]=i<0?'':decodeURIComponent(p.slice(i+1)); } });
var CLOUD, SCN=0;
function resetCloud(){ CLOUD={docs:{},listens:{},frames:{},writes:0,history:[]}; }
function L(){ var s=[].slice.call(arguments).map(function(x){return typeof x==='string'?x:JSON.stringify(x);}).join(' '); var el=document.getElementById('log'); el.textContent+=s+'\n'; el.scrollTop=1e9; }
var waiters={ready:{},eval:{}}, evSeq=0;
window.addEventListener('message',function(e){
  var m=e.data; if(!m||!m.__st)return; var dev=m.dev;
  if(m.kind==='rpc'){ var a=m.args||{}, f=CLOUD.frames[dev]; if(!f)return;
    var reply=function(ok,res,err){ try{ f.contentWindow.postMessage({__st:1,kind:'rpcRes',id:m.id,ok:ok,result:res,error:err},'*'); }catch(x){} };
    if(m.op==='get'){ reply(true,CLOUD.docs[a.path]||null); }
    else if(m.op==='set'){ CLOUD.docs[a.path]=a.data; CLOUD.writes++; CLOUD.history.push({dev:dev,path:a.path,ts:a.data&&a.data.ts}); reply(true,null); broadcast(a.path,dev); }
    else if(m.op==='del'){ delete CLOUD.docs[a.path]; reply(true,null); broadcast(a.path,dev); }
    else if(m.op==='txcommit'){   /* 트랜잭션: 읽은 문서가 그 사이 바뀌었으면 거절(aborted), 아니면 한꺼번에 씀 */
      var rd=a.reads||{}, bad=Object.keys(rd).filter(function(p){ var c=CLOUD.docs[p]; var cur=c?(c.ts||'__nots'):null; return cur!==rd[p]; });
      if(bad.length){ CLOUD.aborts=(CLOUD.aborts||0)+1; reply(false,null,'aborted: '+bad.join(',')); return; }
      (a.writes||[]).forEach(function(w){ CLOUD.docs[w.path]=w.data; CLOUD.writes++; CLOUD.history.push({dev:dev,path:w.path,ts:w.data&&w.data.ts,tx:1}); });
      reply(true,null); (a.writes||[]).forEach(function(w){ broadcast(w.path,dev); }); }
    else if(m.op==='listen'){ (CLOUD.listens[dev]=CLOUD.listens[dev]||{})[a.path]=1; reply(true,CLOUD.docs[a.path]||null); }
    else reply(false,null,'unknown op '+m.op);
    return; }
  if(m.kind==='ready'){ var w=waiters.ready[dev]; if(w){ delete waiters.ready[dev]; w(m); } return; }
  if(m.kind==='evalRes'){ var w2=waiters.eval[m.id]; if(w2){ delete waiters.eval[m.id]; w2(m); } return; }
});
function broadcast(path,from){ Object.keys(CLOUD.frames).forEach(function(d){ if(d===from)return; if(!(CLOUD.listens[d]||{})[path])return; try{ CLOUD.frames[d].contentWindow.postMessage({__st:1,kind:'snap',path:path,doc:CLOUD.docs[path]||null},'*'); }catch(x){} }); }

/* ── 장면에서 쓰는 도구 */
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function open(dev,opt){ opt=opt||{};
  return new Promise(function(res,rej){
    var host=dev.toLowerCase()+SCN+'.localhost';
    var f=document.createElement('iframe'); f.title=dev;
    f.src='http://'+host+':'+PORT+'/app.html?dev='+dev+(opt.seed?('&seed='+opt.seed):'')+(opt.quota?('&quota='+opt.quota):'');
    CLOUD.frames[dev]=f; delete CLOUD.listens[dev];
    var to=setTimeout(function(){ delete waiters.ready[dev]; rej(new Error(dev+' 기기가 40초 안에 안 켜짐')); },40000);
    waiters.ready[dev]=function(m){ clearTimeout(to); if(m.timeout){ rej(new Error(dev+' 준비 시간 초과: '+JSON.stringify(m.logs||[]))); return; } L('  '+dev+' 켜짐 '+m.ms+'ms'); res(m.ms); };
    document.getElementById('frames').appendChild(f);
  }); }
function close(dev){ var f=CLOUD.frames[dev]; if(f){ f.remove(); } delete CLOUD.frames[dev]; delete CLOUD.listens[dev]; L('  '+dev+' 닫음'); }
function ev(dev,code){ return new Promise(function(res,rej){ var f=CLOUD.frames[dev]; if(!f)return rej(new Error(dev+' 없음')); var id='e'+(++evSeq);
  var to=setTimeout(function(){ delete waiters.eval[id]; rej(new Error(dev+' 응답 없음: '+code.slice(0,80))); },15000);
  waiters.eval[id]=function(m){ clearTimeout(to); if(m.ok)res(m.value); else rej(new Error(dev+': '+m.error)); };
  f.contentWindow.postMessage({__st:1,kind:'eval',id:id,code:code},'*'); }); }
async function until(dev,code,pred,ms){ var t0=Date.now(), v; ms=ms||10000;
  while(Date.now()-t0<ms){ try{ v=await ev(dev,code); if(pred(v))return {ok:true,v:v,ms:Date.now()-t0}; }catch(e){ v='ERR '+e.message; } await sleep(250); }
  return {ok:false,v:v,ms:Date.now()-t0}; }
async function untilCloud(pred,ms){ var t0=Date.now(); ms=ms||10000; while(Date.now()-t0<ms){ if(pred(CLOUD.docs))return true; await sleep(200); } return false; }
function offline(dev,on){ return ev(dev,'__syncTest.setOffline('+(on?'true':'false')+');1'); }
var CO='fpm_co_t', DOCP='users/U_TEST/data/';
/* 두 기기(A=맥, B=폰)를 같은 자료로 맞춰 켜기: A 에 시험 자료를 심고 → 창고로 올린 뒤 → 빈 B 를 켜서 받아 오게 */
async function twoDevices(){
  await open('A',{seed:'basic'});
  await ev('A','saveData();1');
  var up=await untilCloud(function(d){ return !!d[DOCP+CO] && Object.keys(d).some(function(k){return k.indexOf(DOCP+CO+'__items_')===0;}); },15000);
  if(!up)throw new Error('A 자료가 창고에 안 올라감 (docs: '+Object.keys(CLOUD.docs).join(', ')+')');
  /* 평소 모습으로: 창고에 자료가 이미 있는 상태에서 두 기기가 켜진다(첫 업로드 길은 한 번뿐이라) */
  close('A'); await open('A');
  await open('B');
  var got=await until('B','Object.keys(S.items||{}).length',function(v){return v===3;},15000);
  if(!got.ok)throw new Error('B 가 자료를 못 받음: 아이템 '+got.v+'개');
}
var q=function(s){ return JSON.stringify(s); };
/* 할일판 시험 판: A 에 만들고 B 가 받을 때까지 */
var TBQ='(S.todoBoard.brands.b1.todo[0].items||[]).map(function(x){return x.id+":"+(x.done?1:0)+":"+x.text;}).join("|")';
async function tbSeed(){
  await ev('A','S.brands=[{id:"b1",name:"브랜드1"}];S.todoBoard={tags:[],brands:{b1:{todo:[{id:"g1",title:"그룹1",items:[{id:"i1",text:"할일1",done:false},{id:"i2",text:"할일2",done:false}]}],made:[],market:[]}}};saveData();1');
  var got=await until('B','(S.todoBoard&&S.todoBoard.brands&&S.todoBoard.brands.b1)?'+TBQ+':""',function(v){return v==='i1:0:할일1|i2:0:할일2';},12000);
  if(!got.ok)throw new Error('B 가 할일판을 못 받음: '+got.v);
}

/* 부자재 자동 맞춤 시험 자료 (10-20): 단가장 메이드 「40/2합」(실) + 지퍼집 슬라이더 DA(300원),
   아이템1 = 40/2합 줄 r1 + 단추 줄 r2(150원), 아이템2 = 슬라이더 고른 지퍼 줄 z1 + 납작이 줄 z2(100원). 두 기기 다 받을 때까지 */
var TRQ='[S.items.it1.trims[1].price,S.items.it2.trims[1].price].join("|")';
async function trimSeed(){
  await ev('A','S.priceBook["메이드"]={materials:{"40/2합":{name:"40/2합",type:"trim",orderType:"thread",unit:"콘"}}};'
    +'S.priceBook["지퍼집"]={materials:{"DA":{name:"DA",type:"trim",pbId:"pbSL1",unitPrice:300}}};'
    +'S.items.it1.trims=[{id:"r1",supplier:"메이드",name:"40/2합",orderType:"thread",price:5000,consumptionPerPiece:1},{id:"r2",supplier:"단추집",name:"자개 11mm",orderType:"count",price:150,consumptionPerPiece:4}];'
    +'S.items.it2.trims=[{id:"z1",supplier:"지퍼집",name:"YKK",orderType:"zipper",slMode:"pick",slRef:{sup:"지퍼집",id:"pbSL1"},slSup:"지퍼집",sliderModel:"DA",sliderCost:300,sliderLogoCost:0,price:500},{id:"z2",supplier:"끈집",name:"납작이",orderType:"count",price:100}];'
    +'saveData();1');
  var got=await until('B','(S.priceBook["메이드"]&&S.priceBook["지퍼집"]&&S.items.it1.trims.length===2&&S.items.it2.trims.length===2)?'+TRQ+':""',function(v){return v==='150|100';},12000);
  if(!got.ok)throw new Error('B 가 부자재 시험 자료를 못 받음: '+got.v);
  await sleep(4000);   /* 받은 직후 일회성 정리(migrateData)가 2.5초 뒤 저장을 부름 — 그게 끝난 뒤에 장면 시작 */
}
/* B 가 정말 옛 자료인지(받기 죽은 사이 A 수정을 못 받았는지) — 아니면 장면이 성립 안 함 */
async function trimStale(){ var p=await ev('B',TRQ); if(p!=='150|100')throw new Error('B 가 옛 자료가 아님(장면 성립 안 됨): '+p); }
/* 옛 자료를 든 창(B)에서 단가장 계산 방식·슬라이더 값이 바뀐 걸 보고 자동 맞춤이 돎 (B 의 단가장만 바꾸고 저장은 자동 맞춤이 함) */
var TR_MECH='S.priceBook["메이드"].materials["40/2합"].orderType="count";S.priceBook["메이드"].materials["40/2합"].unit="ea";S.priceBook["지퍼집"].materials["DA"].unitPrice=350;';

/* 단가장 단가·이름 전파 시험 자료 (10-20): 메이드 40/2합 5000원 · 60/3합 800원, 아이템1 = r1(40/2합) + r2(단추 150원). 두 기기 다 받을 때까지 */
var PRQ='S.items.it1.trims.map(function(t){return t.id+":"+t.unitPrice+":"+(t.consumptionPerPiece||"")}).join("|")';
async function prSeed(){
  await ev('A','S.priceBook["메이드"]={materials:{"40/2합":{name:"40/2합",type:"trim",orderType:"count",unit:"ea",unitPrice:5000},"60/3합":{name:"60/3합",type:"trim",orderType:"count",unit:"ea",unitPrice:800}}};'
    +'S.items.it1.trims=[{id:"r1",supplier:"메이드",name:"40/2합",orderType:"count",unitPrice:5000,consumptionPerPiece:1},{id:"r2",supplier:"단추집",name:"자개 11mm",orderType:"count",unitPrice:150,consumptionPerPiece:4}];saveData();1');
  var got=await until('B','(S.priceBook["메이드"]&&S.priceBook["메이드"].materials["60/3합"]&&S.items.it1.trims.length===2)?'+PRQ+':""',function(v){return v==='r1:5000:1|r2:150:4';},12000);
  if(!got.ok)throw new Error('B 가 단가 시험 자료를 못 받음: '+got.v);
  await sleep(4000);   /* trimSeed 와 같은 이유(받은 직후 일회성 정리 저장) */
}
/* ===== 장면들 — weak:true 는 지금 방식의 «알려진 약한 곳»(실패가 예상됨, 올리기를 막지 않음) ===== */
var SCENES=[
 {id:'S1',name:'한쪽에서 고치면 다른 기기에 나타난다',run:async function(){
   await twoDevices();
   await ev('A','S.items.it1.name='+q('S1-A가 고침')+';saveData();1');
   var r=await until('B','S.items.it1&&S.items.it1.name',function(v){return v==='S1-A가 고침';},10000);
   return {pass:r.ok,detail:'B 아이템1 이름 = '+r.v+' ('+r.ms+'ms)'}; }},
 {id:'S2',name:'인터넷 끊긴 폰과 맥이 서로 다른 아이템을 고침 → 둘 다 남는다',run:async function(){
   await twoDevices();
   await offline('B',true);
   await ev('A','S.items.it1.name='+q('S2-A')+';saveData();1');
   await ev('B','S.items.it2.name='+q('S2-B')+';saveData();1');
   await sleep(2500);
   await offline('B',false);
   var a=await until('A','[S.items.it1.name,S.items.it2.name].join("|")',function(v){return v==='S2-A|S2-B';},12000);
   var b=await until('B','[S.items.it1.name,S.items.it2.name].join("|")',function(v){return v==='S2-A|S2-B';},12000);
   return {pass:a.ok&&b.ok,detail:'A='+a.v+' · B='+b.v}; }},
 /* S3: 09-29 동기화 4번에서 고침(칸마다 수정시각 _fm → 칸별로 합침). 이제 꼭 통과해야 함. */
 {id:'S3',name:'같은 아이템의 다른 칸을 두 기기에서 고침 → 둘 다 남는다',run:async function(){
   await twoDevices();
   await offline('B',true);
   await ev('A','S.items.it1.memo='+q('A메모')+';saveData();1');
   await ev('B','S.items.it1.laborCost=2222;saveData();1');
   await sleep(2500);
   await offline('B',false);
   await sleep(5000);
   var code='(S.items.it1.memo||"")+"|"+S.items.it1.laborCost';
   var a=await ev('A',code), b=await ev('B',code);
   return {pass:a==='A메모|2222'&&b==='A메모|2222',detail:'A='+a+' · B='+b+' (둘 다 「A메모|2222」여야 함)'}; }},
 {id:'S4',name:'끊긴 폰이 모르는 사이 지운 오더 → 폰이 다시 붙어도 안 살아난다',run:async function(){
   await twoDevices();
   await offline('B',true);
   await ev('A','delete S.orders.o1;saveData();1');
   await ev('B','S.orders.o2.name='+q('S4-B')+';saveData();1');
   await sleep(2500);
   await offline('B',false);
   await sleep(5000);
   var code='(S.orders.o1?"o1있음":"o1없음")+"|"+(S.orders.o2&&S.orders.o2.name)';
   var a=await until('A',code,function(v){return v==='o1없음|S4-B';},8000);
   var b=await until('B',code,function(v){return v==='o1없음|S4-B';},8000);
   close('B'); await open('B');
   var b2=await until('B',code,function(v){return v==='o1없음|S4-B';},8000);
   return {pass:a.ok&&b.ok&&b2.ok,detail:'A='+a.v+' · B='+b.v+' · B 다시 켬='+b2.v}; }},
 {id:'S5',name:'폰을 꺼 둔 사이 맥에서 두 번 고침 → 폰을 켜도 옛값으로 안 덮는다',run:async function(){
   await twoDevices();
   close('B');
   await ev('A','S.items.it1.name='+q('S5-1')+';saveData();1'); await sleep(1500);
   await ev('A','S.items.it1.name='+q('S5-2')+';saveData();1'); await sleep(2500);
   await open('B');
   var b=await until('B','S.items.it1.name',function(v){return v==='S5-2';},10000);
   await sleep(3000);
   var a=await ev('A','S.items.it1.name');
   return {pass:b.ok&&a==='S5-2',detail:'B='+b.v+' · A(폰 켠 뒤)='+a}; }},
 /* S6: 두 기기가 같은 상자를 거의 같은 순간 저장하면, 늦게 도착한 쪽이 문서를 통째로 덮어 한쪽 추가분이 빠지던 경합
       (09-28 첫 검사에서 두 번 중 한 번). 09-29 동기화 4번에서 고침 — «읽은 뒤 아무도 안 썼을 때만 쓰기»(트랜잭션), 겹치면 다시 합쳐 올림. */
 {id:'S6',name:'두 기기가 거의 동시에 할일을 하나씩 추가 → 둘 다 남는다',run:async function(){
   await twoDevices();
   await Promise.all([
     ev('A','S.tasks.push({id:"tkA",text:"A할일",done:false,priority:"normal",createdAt:"2026-09-28"});saveData();1'),
     ev('B','S.tasks.push({id:"tkB",text:"B할일",done:false,priority:"normal",createdAt:"2026-09-28"});saveData();1')]);
   var code='S.tasks.map(function(t){return t.id;}).sort().join(",")';
   var a=await until('A',code,function(v){return /tkA/.test(v)&&/tkB/.test(v);},12000);
   var b=await until('B',code,function(v){return /tkA/.test(v)&&/tkB/.test(v);},12000);
   return {pass:a.ok&&b.ok,detail:'A='+a.v+' · B='+b.v}; }},
 {id:'S7',name:'폰에서 고치자마자 앱을 닫음 → 다시 열면 맥에도 전해진다',run:async function(){
   await twoDevices();
   await ev('B','S.items.it3.name='+q('S7-B')+';saveData();1');
   close('B');
   await sleep(2000);
   var before=await ev('A','S.items.it3.name');
   await open('B');
   var a=await until('A','S.items.it3.name',function(v){return v==='S7-B';},12000);
   return {pass:a.ok,detail:'닫은 직후 A='+before+' · B 다시 연 뒤 A='+a.v}; }},
 /* S8 (09-29a 할일판 스케줄표): 새 컬렉션 calEvents 가 저장·올리기·받기·묘비까지 다 배선됐는지 — 따로 상자 __cal */
 {id:'S8',name:'스케줄표: 폰 일정이 맥에 뜨고, 끊긴 폰이 모르는 사이 맥에서 지운 일정은 다시 붙어도 안 살아난다',run:async function(){
   await twoDevices();
   await ev('B','S.calEvents=S.calEvents||[];S.calEvents.push({id:"ceB",date:"2026-10-01",text:"B일정",brandId:"",done:false});saveData();1');
   var a=await until('A','(S.calEvents||[]).some(function(e){return e&&e.id==="ceB";})',function(v){return v===true;},12000);
   await offline('B',true);
   await ev('A','_arrDelWhere("calEvents",function(x){return x&&x.id==="ceB";});saveData();1');
   await ev('B','S.calEvents.push({id:"ceC",date:"2026-10-02",text:"C일정",brandId:"",done:false});saveData();1');
   await sleep(2500);
   await offline('B',false);

 /* S21 (10-20): 줄 단위 합치기 규칙을 함수로 바로 검사 (기기 하나). 옛 자료(줄 도장 없음)·줄 번호 없는 줄·번호 겹침은 예전과 똑같이,

async function main(){
  var only=(Q.only||'').split(',').filter(Boolean), out=[], t00=Date.now();
  for(var i=0;i<SCENES.length;i++){ var s=SCENES[i]; if(only.length&&only.indexOf(s.id)<0)continue;
