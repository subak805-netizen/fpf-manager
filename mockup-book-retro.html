<!doctype html><html lang="ko" data-theme="retro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단가장 레트로 테마 — 미리보기</title>
<link rel="stylesheet" href="css/main.css?v=20260807">
<style>
:root{--ink:#0B0A05;--paper:#FFFCF7;--paper2:#F5F1E8;--cream:#EFE8D4;--neon-green:#A5E6BA;--neon-green-tint:#E8F6EE;--neon-blue:#B0DBF0;--neon-blue-tint:#EAF3F8;--khaki:#6B7A3F;--br:#e0ddd8;}
body{margin:0;padding:16px 14px 60px;background:#EFEDE7;height:auto!important;overflow:auto!important}
.mk-wrap{max-width:1240px;margin:0 auto}
.mk-h{font-size:20px;font-weight:800;color:var(--ink);margin:0 0 4px}
.mk-sub{font-size:13px;color:#6b6455;margin:0 0 14px;line-height:1.7}
.mk-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;z-index:5;background:#EFEDE7;padding:8px 0}
.mk-bar button{font:inherit;font-size:13px;font-weight:800;padding:8px 14px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;border-radius:0;box-shadow:2px 2px 0 rgba(11,10,5,.16)}
.mk-bar button.on{background:var(--neon-green)}
.mk-note{font-size:12px;color:#6b6455;background:#FBF8EF;border:1.5px dashed #cdc6b4;padding:10px 12px;margin:14px 0 18px;line-height:1.9}
.mk-sec-t{font-size:14px;font-weight:800;color:var(--ink);margin:22px 0 8px}

/* ===== 제안: 단가장 레트로 (업체관리와 같은 규칙) ===== */
body.retro-on #pane-book .card{border:2.5px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 rgba(11,10,5,.16);background:#fff;padding:0;overflow:hidden}
body.retro-on #pane-book .card>.fb{background:var(--khaki);color:#fff;margin:0!important;padding:9px 12px;border-bottom:2.5px solid var(--ink)}
body.retro-on #pane-book .card>.fb .tag{background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:0;font-weight:800}
body.retro-on #pane-book .card>.fb .bk-loc{color:#EFE8D4!important}
body.retro-on #pane-book .book-detail{padding:12px}
body.retro-on #pane-book .btn{border:2px solid var(--ink);border-radius:0;box-shadow:2px 2px 0 rgba(11,10,5,.16);font-weight:800;background:#fff;color:var(--ink)}
body.retro-on #pane-book .card>.fb .btn{box-shadow:2px 2px 0 rgba(0,0,0,.35)}
body.retro-on #pane-book .btn:active{transform:translate(2px,2px);box-shadow:none}
body.retro-on #pane-book .btn.d{border-color:#c0392b;color:#c0392b}
body.retro-on #pane-book input,body.retro-on #pane-book select,body.retro-on #pane-book textarea{border:2px solid var(--ink)!important;border-radius:0!important;background:#fff}
body.retro-on #pane-book .bk-info-btn{border:2px solid var(--ink)!important;border-radius:0!important;background:var(--paper2)!important;color:var(--ink)!important;font-weight:800}
/* 표 */
body.retro-on #pane-book table.tbl{border:2px solid var(--ink);border-collapse:collapse;background:#fff}
body.retro-on #pane-book table.tbl th{background:var(--cream);color:var(--ink);font-weight:800;border:1px solid var(--ink);font-size:11.5px;padding:6px 7px;white-space:nowrap}
/* 품목 이름 — 넓게 + 줄바꿈(가로로 잘리지 않게) */
#pane-book table.tbl{table-layout:auto;width:100%;min-width:940px}
#pane-book table.tbl th.c-name,#pane-book table.tbl td.c-name{min-width:210px;width:26%}
#pane-book table.tbl td.c-name .nm{width:100%;font-size:13px;font-weight:700;line-height:1.35;padding:5px 6px;
  white-space:normal;overflow-wrap:anywhere;resize:none;min-height:32px;font-family:inherit}
body.retro-on #pane-book table.tbl td.c-name .nm{border:1.5px solid rgba(11,10,5,.28)!important;background:transparent}
body.retro-on #pane-book table.tbl td.c-name .nm:focus{border-color:var(--ink)!important;background:#fff;outline:none}
body.retro-on #pane-book table.tbl td{border:1px solid rgba(11,10,5,.35);padding:4px 6px;vertical-align:middle}
body.retro-on #pane-book table.tbl tbody tr:nth-child(even){background:#FBF8EF}
/* 표 안 입력칸은 테두리 없이 (칸 자체가 격자라 이중선 방지) */
body.retro-on #pane-book table.tbl td input,body.retro-on #pane-book table.tbl td select{border:1.5px solid rgba(11,10,5,.28)!important;background:transparent}
body.retro-on #pane-book table.tbl td input:focus,body.retro-on #pane-book table.tbl td select:focus{border-color:var(--ink)!important;background:#fff;outline:none}
/* 색 강조칸 — 레트로 팔레트로 */
body.retro-on #pane-book table.tbl th.c-spec,body.retro-on #pane-book table.tbl td.c-spec{background:var(--neon-blue-tint)}
body.retro-on #pane-book table.tbl th.c-comp,body.retro-on #pane-book table.tbl td.c-comp{background:var(--neon-green-tint)}
body.retro-on #pane-book table.tbl th.c-nego,body.retro-on #pane-book table.tbl td.c-nego{background:#FFF6B8}
body.retro-on #pane-book .badge{border:1.5px solid var(--ink);border-radius:0;font-weight:800;background:#fff;color:var(--ink)}
body.retro-on #pane-book .pb-catchip{border:2px solid var(--ink);border-radius:0;background:#fff;font-weight:800}
body.retro-on #pane-book .pb-catchip.on{background:var(--neon-green)}
body.retro-on #pane-book .bk-grouphd{background:var(--khaki);color:#fff;font-weight:800;border:1px solid var(--ink)}
body.retro-on #pane-book #book-pane-title{font-size:17px}
</style></head>
<body class="retro-on"><div class="mk-wrap">

<h1 class="mk-h">원단·부자재 단가장 — 레트로 테마 제안</h1>
<p class="mk-sub">업체관리와 <b>같은 규칙</b>으로 맞춘 안입니다. 위 버튼으로 지금 화면과 번갈아 보실 수 있어요.</p>

<div class="mk-bar">
  <button id="b-on" class="on" onclick="setR(true)">레트로 (제안)</button>
  <button id="b-off" onclick="setR(false)">지금 화면</button>
</div>

<div class="mk-note">
<b>맞춘 규칙</b> — 업체관리에서 쓰는 것 그대로<br>
· 거래처 카드 = <b>2.5px 검정 테두리 + 각진 모서리 + 오프셋 그림자</b><br>
· 거래처 이름줄 = <b>카키 바 + 흰 글씨</b> (브랜드관리 헤더와 동일)<br>
· 버튼 = 각진 검정 테두리 + 눌리는 그림자<br>
· 표 = 각진 격자, 머리줄은 크림색, 홀짝 줄무늬<br>
· 강조칸 색만 레트로 팔레트로 교체 — <span style="background:#EAF3F8;padding:1px 5px;border:1px solid #0B0A05">크기·규격</span>
<span style="background:#E8F6EE;padding:1px 5px;border:1px solid #0B0A05">혼용률</span>
<span style="background:#FFF6B8;padding:1px 5px;border:1px solid #0B0A05">네고가</span>
</div>

<div id="pane-book">
  <div class="fb" style="margin-bottom:10px"><b id="book-pane-title">원단 단가장</b><div class="muted">아이템 저장 시 자동 누적</div></div>
  <div id="book-c"></div>
</div>

<script>
function setR(on){document.body.classList.toggle('retro-on',on);document.getElementById('b-on').className=on?'on':'';document.getElementById('b-off').className=on?'':'on';}

var FAB=[
 {nm:'RTL',cl:'-',ot:'YARD',cat:'원단',spec:'58',roll:'—',comp:'80%W, 20%N',store:26000,nego:24500},
 {nm:'20수 옥스포드',cl:'-',ot:'YARD',cat:'원단',spec:'44',roll:'—',comp:'100%C',store:4200,nego:3900},
 {nm:'폴리 트윌',cl:'-',ot:'KG',cat:'원단',spec:'58',roll:'—',comp:'100%P',store:11000,nego:0}
];
var TRM=[
 {nm:'코메즈밴드 40mm 검',cl:'검정',ot:'롤',cat:'밴드',spec:'40미리',roll:50,comp:'',store:17000,nego:16000},
 {nm:'YKK 5호 오픈',cl:'검정',ot:'지퍼',cat:'지퍼',spec:'5호',roll:'',comp:'',store:900,nego:850},
 {nm:'4구 단추 15mm',cl:'앤틱골드',ot:'개수',cat:'단추',spec:'15mm',roll:'',comp:'',store:130,nego:120},
 {nm:'코메즈밴드 40mm 검정 (신관증측동 전용 · 긴이름 확인용)',cl:'검정',ot:'롤',cat:'밴드',spec:'40미리',roll:50,comp:'',store:17000,nego:0}
];

function row(m,isFab){
  var sel=function(v){return '<select style="font-size:11px;padding:3px 5px"><option>'+v+'</option></select>';};
  return '<tr>'
   +'<td class="c-name"><textarea class="nm" rows="1">'+m.nm+'</textarea></td>'
   +'<td>'+(isFab?'<span class="muted" style="font-size:10px">-</span>':'<input type="text" value="'+m.cl+'" style="font-size:11px;width:74px;padding:3px 5px">')+'</td>'
   +'<td>'+(isFab?'<span class="badge b1">'+m.ot+'</span>':sel(m.ot))+'</td>'
   +'<td>'+(isFab?'<span class="muted" style="font-size:10px">원단</span>':sel(m.cat))+'</td>'
   +'<td class="c-spec"><input type="text" value="'+m.spec+'" style="width:70px;font-size:11px;padding:3px 5px"></td>'
   +'<td class="c-spec">'+(isFab?'<span class="muted" style="font-size:10px">—</span>':'<input type="number" value="'+m.roll+'" style="width:58px;font-size:11px;padding:3px 5px">')+'</td>'
   +'<td class="c-comp">'+(isFab?'<input type="text" value="'+m.comp+'" style="width:130px;font-size:11px;padding:3px 5px">':'<span class="muted" style="font-size:10px">—</span>')+'</td>'
   +'<td><input type="number" value="'+m.store+'" style="width:80px;font-size:12px;padding:3px 5px"> <span class="muted" style="font-size:10px">원</span></td>'
   +'<td class="c-nego"><input type="number" value="'+(m.nego||'')+'" placeholder="'+m.store.toLocaleString()+'" style="width:80px;font-size:12px;padding:3px 5px"> <span class="muted" style="font-size:10px">원</span></td>'
   +'<td style="white-space:nowrap"><button class="btn s">사용처</button> <button class="btn s d">삭제</button></td>'
   +'</tr>';
}
function card(si,sup,loc,list,isFab){
  return '<div class="card" style="margin-bottom:12px">'
   +'<div class="fb" style="margin-bottom:8px;cursor:pointer">'
     +'<div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:11px">▼</span>'+sup
       +'<span class="bk-loc muted" style="font-weight:400;font-size:11px">'+loc+'</span></div>'
     +'<div class="fr" style="gap:5px">'
       +'<span class="tag">'+list.length+'개 품목</span>'
       +'<button class="btn s">＋ 품목</button><button class="btn s">이름</button><button class="btn s d">삭제</button>'
     +'</div>'
   +'</div>'
   +'<div class="book-detail">'
     +'<button type="button" class="bk-info-btn" style="width:100%;text-align:left;background:var(--bg2);border:1px solid var(--br);border-radius:6px;padding:7px 10px;font-size:11px;font-weight:700;color:var(--t2);cursor:pointer;margin-bottom:9px">거래처 정보 (연락처·계좌·위치) ▶</button>'
     +'<div style="font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px">단가 수정 <span class="muted" style="font-weight:400">매장단가는 원가계산 / 네고가는 결제에 사용</span></div>'
     +'<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
       +'<th class="c-name">품목</th><th>색상</th><th>유형</th><th>종류</th><th class="c-spec">크기/규격</th><th class="c-spec">롤당yard</th><th class="c-comp">혼용률</th><th>매장단가</th><th class="c-nego">네고가</th><th>관리</th>'
     +'</tr></thead><tbody>'+list.map(function(m){return row(m,isFab);}).join('')+'</tbody></table></div>'
   +'</div></div>';
}
function fitNames(){document.querySelectorAll('#pane-book textarea.nm').forEach(function(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';});}
document.getElementById('book-c').innerHTML=
  card(0,'조인','동대문시장 B동 2F 215호',FAB,true)
 +'<div class="mk-sec-t">부자재 단가장 (같은 규칙)</div>'
 +card(1,'메이드','동대문시장 기타 3F 신관증측동',TRM,false);
fitNames(); window.addEventListener('resize',fitNames);
document.addEventListener('input',function(e){if(e.target.classList&&e.target.classList.contains('nm'))fitNames();});
</script>
</div></body></html>
