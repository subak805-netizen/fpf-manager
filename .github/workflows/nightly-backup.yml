name: nightly-backup
# FPF 밤마다 서버 백업 (동기화 2번, 2026-09-28) — 파이어스토어 문서 전부(앱 7개)를 스토리지 backups/firestore/ 에 하루 1개.
# 03:00 KST(18:00 UTC) 예약. 깃허브 예약은 1~2시간 늦게 도는 게 보통이라 실제로는 새벽 4~5시쯤.
# 필요한 Secret: FIREBASE_SERVICE_ACCOUNT (아침 브리핑과 같은 것, 등록돼 있음). 없으면 실패로 표시(조용히 건너뛰지 않음).
# 수동 실행: gh workflow run nightly-backup.yml
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}
concurrency:
  group: nightly-backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/nightly-backup.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
