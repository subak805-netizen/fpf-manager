<!doctype html><html lang="ko" data-theme="minimal"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소재 관리 탭 — 미리보기</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
@import url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css');

/* ===== 토큰 (DESIGN_GUIDE) ===== */
:root{
  --page-bg:#f0eee9;--font:-apple-system,BlinkMacSystemFont,"Pretendard Variable","Apple SD Gothic Neo",sans-serif;
  --text:#222;--t2:#666;--t3:#999;
  --card-bg:#fff;--card-bd:#e0ddd8;--card-bdw:1px;--card-radius:8px;--card-shadow:none;
  --head-bg:#f8f7f5;--head-bd:#e0ddd8;
  --input-bg:#fff;--input-bd:#e0ddd8;--input-radius:6px;
  --accent:#185FA5;--accent-bg:#eff6ff;--accent-bd:#bfdbfe;--accent-text:#1e40af;
  --soft-bg:#f8f7f5;--soft-bd:#c5c0ba;
  --chip-on-bg:#222;--chip-on-text:#fff;
  --btn-bg:#fff;--btn-bd:#c5c0ba;--red:#A32D2D;
  --ttl-font:var(--font);--shadow-hard:none;
}
[data-theme="retro"]{
  --page-bg:#EFE8D4;--font:'Pretendard Variable',-apple-system,sans-serif;
  --text:#0B0A05;--t2:#3a3528;--t3:#6b6555;
  --card-bg:#FFFCF7;--card-bd:#0B0A05;--card-bdw:2.5px;--card-radius:0;--card-shadow:4px 4px 0 #0B0A05;
  --head-bg:#B0DBF0;--head-bd:#0B0A05;
  --input-bg:#fff;--input-bd:#0B0A05;--input-radius:0;
  --accent:#0B0A05;--accent-bg:#EAF3F8;--accent-bd:#0B0A05;--accent-text:#0B0A05;
  --soft-bg:#F5F1E8;--soft-bd:#0B0A05;
  --chip-on-bg:#A5E6BA;--chip-on-text:#0B0A05;
  --btn-bg:#fff;--btn-bd:#0B0A05;--red:#c0392b;
  --ttl-font:'Galmuri11','Pretendard Variable',sans-serif;--shadow-hard:2px 2px 0 #0B0A05;
}
*{box-sizing:border-box}
body{margin:0;padding:0;background:#EFEDE7;font-family:var(--font);color:var(--text);-webkit-text-size-adjust:100%}
input,select,textarea,button{font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ===== 미리보기 껍데기 ===== */
.mk-top{position:sticky;top:0;z-index:50;background:#EFEDE7;border-bottom:1px solid #d8d4cc;padding:10px 14px}
.mk-h{font-size:17px;font-weight:800;margin:0 0 2px}
.mk-sub{font-size:12px;color:#6b6455;margin:0 0 9px}
.mk-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mk-bar button{font-size:12.5px;font-weight:700;padding:7px 12px;border:1px solid #bdb8ae;background:#fff;color:#333;cursor:pointer;border-radius:6px;white-space:nowrap}
.mk-bar button.on{background:#222;color:#fff;border-color:#222}
.mk-bar .sep{width:1px;height:20px;background:#cfcac1;margin:0 4px}
.mk-stage{padding:16px 14px 80px;display:flex;justify-content:center}
.mk-frame{width:100%;max-width:1240px;background:var(--page-bg);border:1px solid #d8d4cc;border-radius:10px;padding:16px;transition:max-width .2s}
body.pv-phone .mk-frame{max-width:390px;border-radius:26px;padding:12px 10px;box-shadow:0 8px 30px rgba(0,0,0,.14)}

/* ===== 소재 관리 화면 ===== */
.mt-hd{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mt-ttl{font-family:var(--ttl-font);font-size:20px;font-weight:800;margin:0;letter-spacing:-.3px}
.mt-cnt{font-size:12px;color:var(--t2);padding-bottom:2px}
.mt-hd .grow{flex:1}
.btn{font-size:12.5px;font-weight:700;padding:8px 12px;border:1px solid var(--btn-bd);background:var(--btn-bg);color:var(--text);border-radius:var(--input-radius);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-hard)}
.btn:active{transform:translate(1px,1px)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="retro"] .btn.p{background:#A5E6BA;color:#0B0A05}

/* 상단 바: 칩 + 검색 + 정렬 + 보기 */
.mt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.kchip{font-size:12.5px;font-weight:700;padding:7px 14px;border:1px solid var(--btn-bd);background:var(--card-bg);color:var(--t2);border-radius:999px;cursor:pointer;white-space:nowrap}
[data-theme="retro"] .kchip{border-radius:0;border-width:2px;box-shadow:var(--shadow-hard);color:var(--text)}
.kchip.on{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:var(--chip-on-bg)}
[data-theme="retro"] .kchip.on{border-color:#0B0A05}
.mt-search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:7px;background:var(--input-bg);border:1px solid var(--input-bd);border-radius:999px;padding:7px 14px}
[data-theme="retro"] .mt-search{border-radius:0;border-width:2px}
.mt-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;color:var(--text)}
.mt-search .lb{font-size:11px;font-weight:800;color:var(--t3);white-space:nowrap}
select.mt-sel{font-size:12.5px;padding:7px 26px 7px 11px;border:1px solid var(--input-bd);background:var(--input-bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M0 0h10L5 7z' fill='%23666'/></svg>") no-repeat right 9px center;border-radius:var(--input-radius);color:var(--text);cursor:pointer}
.vsw{display:flex;border:1px solid var(--btn-bd);border-radius:var(--input-radius);overflow:hidden}
[data-theme="retro"] .vsw{border-width:2px;box-shadow:var(--shadow-hard)}
.vsw button{font-size:12px;font-weight:700;padding:7px 12px;border:none;background:var(--card-bg);color:var(--t2);cursor:pointer;white-space:nowrap}
.vsw button.on{background:var(--chip-on-bg);color:var(--chip-on-text)}

/* 사진 드래그앤드롭 */
.dz{position:relative;border-radius:var(--input-radius)}
.dz.over::after{content:'여기에 놓으면 사진이 올라가요';position:absolute;inset:-6px;border:2.5px dashed var(--accent);border-radius:var(--input-radius);background:rgba(24,95,165,.08);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--accent-text);z-index:3}
[data-theme="retro"] .dz.over::after{background:rgba(165,230,186,.5);border-color:#0B0A05;color:#0B0A05}
.dz-hint{font-size:11px;color:var(--t3);font-weight:700;margin-top:7px;text-align:center}
.auto-box{margin-top:9px;background:var(--accent-bg);border:1px solid var(--accent-bd);border-radius:var(--input-radius);padding:9px 11px;font-size:12px;line-height:1.7}
[data-theme="retro"] .auto-box{background:#FFF6B8;border:2px dashed #0B0A05}
.auto-box>b:first-child{display:block;font-size:11.5px;margin-bottom:4px}
.auto-row{display:flex;align-items:center;gap:7px;margin-top:4px}
.auto-sw{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:0 0 22px}
[data-theme="retro"] .auto-sw{border-radius:0;border:1.5px solid #0B0A05}

/* 검색 예시 줄 */
.mt-ex{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--t3);font-weight:700;margin:0 0 12px}
.mt-ex span{font-size:11.5px;font-weight:700;padding:4px 10px;border:1px dashed var(--soft-bd);border-radius:999px;color:var(--t2);cursor:pointer;background:var(--card-bg);white-space:nowrap}
[data-theme="retro"] .mt-ex span{border-radius:0;border-width:1.5px}

/* 본문 = 사이드바 + 목록 */
.mt-body{display:flex;gap:14px;align-items:flex-start}
.mt-side{width:212px;flex:0 0 212px;background:var(--card-bg);border:var(--card-bdw) solid var(--card-bd);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:12px;max-height:78vh;overflow:auto}
.mt-main{flex:1;min-width:0}
.fs-h{display:flex;align-items:center;margin:0 0 8px}
.fs-h b{font-size:13px}
.fs-h span{margin-left:auto;font-size:11px;color:var(--t3);cursor:pointer;text-decoration:underline}
.fs-g{margin-bottom:14px}
.fs-t{font-size:11.5px;font-weight:800;color:var(--t2);margin-bottom:6px}
.fs-o{display:flex;flex-wrap:wrap;gap:5px}
.fo{font-size:11.5px;font-weight:600;padding:5px 9px;border:1px solid var(--input-bd);background:var(--input-bg);border-radius:var(--input-radius);cursor:pointer;white-space:nowrap;color:var(--text)}
[data-theme="retro"] .fo{border-width:1.5px}
.fo .n{font-size:10.5px;color:var(--t3);margin-left:4px;font-weight:500}
.fo.on{background:var(--chip-on-bg);color:var(--chip-on-text);border-color:var(--chip-on-bg)}
.fo.on .n{color:inherit;opacity:.75}
.fo.zero{opacity:.35}

/* 격자 카드 */
.mt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:13px}
.mc{background:var(--card-bg);border:var(--card-bdw) solid var(--card-bd);border-radius:var(--card-radius);box-shadow:var(--card-shadow);overflow:hidden;cursor:pointer}
.mc:active{transform:translate(1px,1px)}
.mc-ph{position:relative;aspect-ratio:1/1;background:#ddd}
.mc-bd{position:absolute;left:7px;top:7px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.93);color:#222;white-space:nowrap;border:1px solid rgba(0,0,0,.1)}
[data-theme="retro"] .mc-bd{border-radius:0;border:1.5px solid #0B0A05;background:#fff}
.mc-bd.s-main{background:#dcfce7;color:#166534}
.mc-bd.s-sample{background:#fef9c3;color:#854f0b}
.mc-bd.s-sourced{background:#f1f5f9;color:#475569}
.mc-bd.s-req{background:#ede9fe;color:#5b21b6}
[data-theme="retro"] .mc-bd.s-main{background:#A5E6BA;color:#0B0A05}
[data-theme="retro"] .mc-bd.s-sample{background:#FFF6B8;color:#0B0A05}
[data-theme="retro"] .mc-bd.s-sourced{background:#F5F1E8;color:#0B0A05}
[data-theme="retro"] .mc-bd.s-req{background:#B0DBF0;color:#0B0A05}
.mc-kind{position:absolute;right:7px;top:7px;font-size:10px;font-weight:800;padding:3px 7px;background:rgba(11,10,5,.72);color:#fff;border-radius:999px}
[data-theme="retro"] .mc-kind{border-radius:0;background:#0B0A05}
.mc-loc{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:700;padding:5px 8px;background:rgba(11,10,5,.68);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-in{padding:9px 10px 11px}
.mc-nm{font-size:13.5px;font-weight:800;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mc-pr{font-size:13px;font-weight:800;white-space:nowrap}
.mc-pr .u{font-size:10.5px;font-weight:600;color:var(--t3)}
.mc-sup{font-size:11px;color:var(--t2);margin:3px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-spec{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-uses{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.ut{font-size:10.5px;font-weight:700;padding:2px 7px;background:var(--accent-bg);color:var(--accent-text);border:1px solid var(--accent-bd);border-radius:999px;white-space:nowrap}
[data-theme="retro"] .ut{border-radius:0;background:#EAF3F8;border-color:#0B0A05;color:#0B0A05}
.mc-row{display:flex;align-items:baseline;gap:6px}
.mc-row .grow{flex:1;min-width:0}

/* 목록 행 */
.mt-list{background:var(--card-bg);border:var(--card-bdw) solid var(--card-bd);border-radius:var(--card-radius);box-shadow:var(--card-shadow);overflow:hidden}
.ml{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--card-bd);cursor:pointer}
.ml:last-child{border-bottom:none}
.ml-ph{width:56px;height:56px;flex:0 0 56px;border-radius:var(--input-radius);background:#ddd;border:1px solid rgba(0,0,0,.08)}
[data-theme="retro"] .ml-ph{border:1.5px solid #0B0A05}
.ml-in{flex:1;min-width:0}
.ml-nm{font-size:13.5px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-sup{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-spec{font-size:11.5px;color:var(--t2);margin-top:2px}
.ml-rt{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ml-pr{font-size:13px;font-weight:800;white-space:nowrap}
.ml-sw{font-size:10.5px;font-weight:700;padding:3px 8px;border:1px dashed var(--soft-bd);border-radius:999px;color:var(--t2);white-space:nowrap}
[data-theme="retro"] .ml-sw{border-radius:0;border-style:dashed;border-width:1.5px}
.ml-sw.none{opacity:.45}

/* 빈 결과 */
.mt-empty{padding:40px 16px;text-align:center;font-size:13px;color:var(--t2);background:var(--card-bg);border:var(--card-bdw) dashed var(--card-bd);border-radius:var(--card-radius)}

/* 상세 시트 */
.dv{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}
.dv.on{display:flex}
.dt{width:100%;max-width:860px;background:var(--card-bg);border:var(--card-bdw) solid var(--card-bd);border-radius:var(--card-radius);box-shadow:var(--card-shadow);overflow:hidden}
.dt-hd{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--head-bg);border-bottom:var(--card-bdw) solid var(--head-bd)}
.dt-hd b{font-family:var(--ttl-font);font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-x{font-size:15px;font-weight:800;border:1px solid var(--btn-bd);background:var(--btn-bg);border-radius:var(--input-radius);width:30px;height:30px;cursor:pointer;color:var(--text)}
.dt-bd{padding:14px;display:flex;gap:16px;align-items:flex-start}
.dt-l{flex:0 0 300px;max-width:300px}
.dt-r{flex:1;min-width:0}
.dt-big{width:100%;aspect-ratio:1/1;border-radius:var(--input-radius);background:#ddd;border:1px solid rgba(0,0,0,.08)}
[data-theme="retro"] .dt-big{border:2px solid #0B0A05}
.dt-thumbs{display:flex;gap:7px;margin-top:8px}
.dt-thumbs div{flex:1;aspect-ratio:1/1;border-radius:var(--input-radius);border:1px solid rgba(0,0,0,.08)}
[data-theme="retro"] .dt-thumbs div{border:1.5px solid #0B0A05}
.dt-add{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--t2);background:var(--soft-bg);border:1px dashed var(--soft-bd)!important;cursor:pointer}
.spec{width:100%;border-collapse:collapse;font-size:12.5px}
.spec td{padding:8px 2px;border-bottom:1px solid var(--card-bd)}
.spec td:first-child{color:var(--t2);white-space:nowrap}
.spec td:last-child{text-align:right;font-weight:700}
.sec{margin-top:14px}
.sec-t{font-size:12px;font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.sec-t .auto{font-size:10px;font-weight:700;padding:2px 6px;background:var(--accent-bg);color:var(--accent-text);border:1px solid var(--accent-bd);border-radius:999px}
[data-theme="retro"] .sec-t .auto{border-radius:0}
.box{background:var(--soft-bg);border:1px solid var(--soft-bd);border-radius:var(--input-radius);padding:10px 11px;font-size:12.5px;line-height:1.75}
[data-theme="retro"] .box{border-width:2px}
.usedlist a{display:inline-block;font-size:12px;font-weight:700;padding:5px 10px;background:var(--card-bg);border:1px solid var(--card-bd);border-radius:999px;margin:0 5px 5px 0;color:var(--accent-text);text-decoration:none;cursor:pointer;white-space:nowrap}
[data-theme="retro"] .usedlist a{border-radius:0;border-width:1.5px;color:#0B0A05}
.kv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.kv label{font-size:11.5px;font-weight:800;color:var(--t2);flex:0 0 76px}
.kv input,.kv select{flex:1;min-width:110px;font-size:12.5px;padding:7px 10px;border:1px solid var(--input-bd);background:var(--input-bg);border-radius:var(--input-radius);color:var(--text);height:34px}
[data-theme="retro"] .kv input,[data-theme="retro"] .kv select{border-width:2px}
.rqrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.rqbadge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
[data-theme="retro"] .rqbadge{border-radius:0;border:1.5px solid #0B0A05}
.rq-wait{background:#ede9fe;color:#5b21b6}
.rq-got{background:#dcfce7;color:#166534}
.rq-no{background:#fee2e2;color:#991b1b}
[data-theme="retro"] .rq-wait{background:#B0DBF0;color:#0B0A05}
[data-theme="retro"] .rq-got{background:#A5E6BA;color:#0B0A05}
[data-theme="retro"] .rq-no{background:#FFF6B8;color:#0B0A05}
.issue{font-size:12px;padding:6px 0;border-bottom:1px dotted var(--card-bd)}
.issue .w{color:var(--t3);font-size:11px;margin-right:6px}

/* 폰: 필터 버튼 + 바텀시트 */
.mt-fbtn{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--card-bg);border-top:var(--card-bdw) solid var(--card-bd);border-radius:14px 14px 0 0;padding:14px 14px 22px;max-height:76vh;overflow:auto;transform:translateY(100%);transition:transform .22s}
[data-theme="retro"] .sheet{border-radius:0}
.sheet.on{transform:translateY(0)}

/* 폰 레이아웃 (실제 폰 + 미리보기 폰모드 둘 다) */
@media (max-width:760px){
  .mt-side{display:none}
  .mt-fbtn{display:inline-flex}
  .mt-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .dt-bd{flex-direction:column}
  .dt-l{flex:1 1 auto;max-width:100%;width:100%}
  .mk-frame{padding:12px 10px}
}
body.pv-phone .mt-side{display:none}
body.pv-phone .mt-fbtn{display:inline-flex}
body.pv-phone .mt-grid{grid-template-columns:repeat(2,1fr);gap:9px}
body.pv-phone .mc-nm{font-size:12.5px}
body.pv-phone .mt-search{max-width:none;flex-basis:100%}
body.pv-phone .dt-bd{flex-direction:column}
body.pv-phone .dt-l{flex:1 1 auto;max-width:100%;width:100%}
/* 폰 모드에선 상세창도 폰 폭 안에서 보이게 (실제 폰에선 화면폭이 곧 한계라 자동으로 이렇게 됨) */
body.pv-phone .dv{padding:14px}
body.pv-phone .dt{max-width:370px}
body.pv-phone .sheet{left:50%;right:auto;transform:translate(-50%,100%);width:390px}
body.pv-phone .sheet.on{transform:translate(-50%,0)}
body.pv-phone .ml-rt .ml-sw{display:none}
</style></head>
<body>

<div class="mk-top">
  <h1 class="mk-h">소재 관리 탭 — 미리보기 시안</h1>
  <p class="mk-sub">키위 구조(필터 사이드바 + 사진 격자 + 스크랩 목록) + FPF 전용(쓴 아이템 · 실물 스와치 위치 · 스와치 요청/수령). 실제로 눌러보실 수 있어요.</p>
  <div class="mk-bar">
    <button id="b-min" class="on" onclick="setTheme('minimal')">기본 테마</button>
    <button id="b-ret" onclick="setTheme('retro')">레트로 테마</button>
    <span class="sep"></span>
    <button id="b-web" class="on" onclick="setPv('web')">사이트(웹)</button>
    <button id="b-pho" onclick="setPv('phone')">핸드폰(390px)</button>
  </div>
</div>

var F={kind:'all',view:'grid',use:[],status:[],mat:[],sup:[],sw:''};
var USES=['자켓','코트','셔츠','원피스','치마','바지','셋업','안감','공통'];
var MATL=['면','울','폴리','레이온','린넨','나일론','메탈'];

function tryQ(q){document.getElementById('q').value=q;render();}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);
  document.getElementById('b-min').className=t==='minimal'?'on':'';
  document.getElementById('b-ret').className=t==='retro'?'on':'';}
function setPv(v){document.body.classList.toggle('pv-phone',v==='phone');
  document.getElementById('b-web').className=v==='web'?'on':'';
  document.getElementById('b-pho').className=v==='phone'?'on':'';}
function setKind(k){F.kind=k;document.querySelectorAll('.kchip').forEach(function(c){c.className='kchip'+(c.dataset.kind===k?' on':'');});render();}
function setView(v){F.view=v;document.getElementById('v-grid').className=v==='grid'?'on':'';document.getElementById('v-list').className=v==='list'?'on':'';render();}
function openSheet(){document.getElementById('sheet-bg').classList.add('on');document.getElementById('sheet').classList.add('on');}
function closeSheet(){document.getElementById('sheet-bg').classList.remove('on');document.getElementById('sheet').classList.remove('on');}
function resetF(){F.use=[];F.status=[];F.mat=[];F.sup=[];F.sw='';document.getElementById('q').value='';render();}
function tog(k,v){var a=F[k],i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);render();}
function togSw(v){F.sw=(F.sw===v?'':v);render();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function won(n){return n.toLocaleString('ko-KR');}

/* 종류칩만 적용한 모집단 — 필터 옵션 개수는 여기서 셈 */
function base(){return MATS.filter(function(m){return F.kind==='all'||m.kind===F.kind;});}
function pass(m,skip){
  if(F.kind!=='all'&&m.kind!==F.kind)return false;
  if(skip!=='use'&&F.use.length&&!F.use.some(function(u){return m.uses.indexOf(u)>=0;}))return false;
  if(skip!=='status'&&F.status.length&&F.status.indexOf(m.status)<0)return false;
  if(skip!=='mat'&&F.mat.length&&!F.mat.some(function(x){return m.mat.indexOf(x)>=0;}))return false;
  if(skip!=='sup'&&F.sup.length&&F.sup.indexOf(m.sup)<0)return false;
  if(skip!=='sw'&&F.sw){if(F.sw==='y'&&!m.swLoc)return false;if(F.sw==='n'&&m.swLoc)return false;}
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  if(q){
    // "자켓용"처럼 '용'을 붙여 쳐도 잡히게 용도의 '…용' 형태도 건초더미에 넣는다
    var hay=[m.name,m.sup,m.comp,m.org,m.swLoc,m.src,STATUS[m.status]]
      .concat(m.uses,m.uses.map(function(u){return u+'용';}),m.mat,m.items).join(' ').toLowerCase();
    // "울100" 처럼 붙여 쳐도 잡히게 공백 제거본도 함께 검사
    if(hay.indexOf(q)<0&&hay.replace(/\s/g,'').indexOf(q.replace(/\s/g,''))<0)return false;
  }
  return true;
}
function cnt(key,val){return base().filter(function(m){
  if(!pass(m,key))return false;
  if(key==='use')return m.uses.indexOf(val)>=0;
  if(key==='status')return m.status===val;
  if(key==='mat')return m.mat.indexOf(val)>=0;
  if(key==='sup')return m.sup===val;
  if(key==='sw')return val==='y'?!!m.swLoc:!m.swLoc;
  return true;}).length;}

function opt(key,val,label){var n=cnt(key,val),on=(key==='sw'?F.sw===val:F[key].indexOf(val)>=0);
  var fn=key==='sw'?("togSw('"+val+"')"):("tog('"+key+"','"+val+"')");
  return '<span class="fo'+(on?' on':'')+(n?'':' zero')+'" onclick="'+fn+'">'+esc(label)+'<span class="n">'+n+'</span></span>';}
function filtersHTML(){
  var sups=[];base().forEach(function(m){if(sups.indexOf(m.sup)<0)sups.push(m.sup);});
  return ''
  +'<div class="fs-g"><div class="fs-t">용도</div><div class="fs-o">'+USES.map(function(u){return opt('use',u,u);}).join('')+'</div></div>'
  +'<div class="fs-g"><div class="fs-t">상태</div><div class="fs-o">'+Object.keys(STATUS).map(function(s){return opt('status',s,STATUS[s]);}).join('')+'</div></div>'
  +'<div class="fs-g"><div class="fs-t">소재</div><div class="fs-o">'+MATL.map(function(x){return opt('mat',x,x);}).join('')+'</div></div>'
  +'<div class="fs-g"><div class="fs-t">실물 스와치</div><div class="fs-o">'+opt('sw','y','가지고 있음')+opt('sw','n','없음')+'</div></div>'
  +'<div class="fs-g"><div class="fs-t">업체</div><div class="fs-o">'+sups.map(function(s){return opt('sup',s,s);}).join('')+'</div></div>';
}
function swatchStyle(m){
  var p=PH[m.id]&&PH[m.id][0];
  if(p)return "background:#fff url('"+p+"') center/cover no-repeat";  // 올린 사진이 있으면 사진이 우선
  var c=(AUTO[m.id]&&AUTO[m.id].color)||m.c;
  if(m.kind==='trim')return 'background:radial-gradient(circle at 50% 45%,'+c+' 0 34%,rgba(0,0,0,.12) 34% 37%,#efece6 37%)';
  if(m.org==='코듀로이')return 'background:repeating-linear-gradient(90deg,'+c+' 0 7px,rgba(0,0,0,.14) 7px 9px)';
  if(m.org==='트윌'||m.org==='서지')return 'background:repeating-linear-gradient(45deg,'+c+' 0 5px,rgba(255,255,255,.22) 5px 10px)';
  if(m.org==='헤링본')return 'background:repeating-linear-gradient(45deg,'+c+' 0 4px,rgba(0,0,0,.09) 4px 8px),repeating-linear-gradient(-45deg,'+c+' 0 4px,rgba(255,255,255,.16) 4px 8px)';
  if(m.org==='자카드'||m.org==='쭈리')return 'background:repeating-linear-gradient(0deg,'+c+' 0 4px,rgba(0,0,0,.08) 4px 6px)';
  return 'background:'+c;
}
function specLine(m){
  if(m.kind==='trim')return esc(m.org)+' · '+m.colors+'컬러';
  return esc(m.comp)+' · '+m.width+'" · '+m.colors+'컬러';
}
function cardHTML(m){
  return '<div class="mc" onclick="openDetail('+m.id+')">'
   +'<div class="mc-ph" style="'+swatchStyle(m)+'">'
     +'<span class="mc-bd s-'+m.status+'">'+STATUS[m.status]+'</span>'
     +'<span class="mc-kind">'+(m.kind==='fabric'?'원단':'부자재')+'</span>'
     +(m.swLoc?'<span class="mc-loc">실물 '+esc(m.swLoc)+'</span>':'')
   +'</div>'
   +'<div class="mc-in">'
     +'<div class="mc-row"><div class="mc-nm grow">'+esc(m.name)+'</div><div class="mc-pr">'+won(m.price)+'<span class="u">/'+esc(m.unit)+'</span></div></div>'
     +'<div class="mc-sup">'+esc(m.sup)+' · '+esc(m.loc)+'</div>'
     +'<div class="mc-spec">'+specLine(m)+'</div>'
     +'<div class="mc-uses">'+m.uses.slice(0,3).map(function(u){return '<span class="ut">'+esc(u)+'</span>';}).join('')+(m.items.length?'<span class="ut" style="background:transparent;border-style:dashed">쓴 아이템 '+m.items.length+'</span>':'')+'</div>'
   +'</div></div>';
}
function rowHTML(m){
  return '<div class="ml" onclick="openDetail('+m.id+')">'
   +'<div class="ml-ph" style="'+swatchStyle(m)+'"></div>'
   +'<div class="ml-in">'
     +'<div class="ml-nm">'+esc(m.name)+' <span class="ut">'+STATUS[m.status]+'</span></div>'
     +'<div class="ml-sup">'+esc(m.sup)+' · '+esc(m.loc)+'</div>'
     +'<div class="ml-spec">'+specLine(m)+(m.items.length?' · 쓴 아이템 '+m.items.length:'')+'</div>'
   +'</div>'
   +'<div class="ml-rt"><div class="ml-pr">'+won(m.price)+'<span class="u" style="font-size:10.5px;font-weight:600">/'+esc(m.unit)+'</span></div>'
     +(m.swLoc?'<span class="ml-sw">실물 '+esc(m.swLoc)+'</span>':'<span class="ml-sw none">실물 없음</span>')+'</div>'
   +'</div>';
}
function render(){
  var rows=MATS.filter(function(m){return pass(m,null);});
  var s=document.getElementById('sort').value;
  rows.sort(function(a,b){
    if(s==='name')return a.name.localeCompare(b.name,'ko');
    if(s==='used')return b.items.length-a.items.length;
    if(s==='price')return a.price-b.price;
    return b.id-a.id;});
  document.getElementById('mt-cnt').textContent='총 '+rows.length+'개 · 실물 스와치 '+rows.filter(function(m){return m.swLoc;}).length+'개 보유';
  var fh=filtersHTML();
  document.getElementById('side').innerHTML='<div class="fs-h"><b>필터</b><span onclick="resetF()">초기화</span></div>'+fh;
  document.getElementById('sheet-body').innerHTML=fh;
  var main=document.getElementById('main');
  if(!rows.length){main.innerHTML='<div class="mt-empty">조건에 맞는 소재가 없어요.<br>필터를 지우거나 다른 말로 검색해 보세요.</div>';return;}
  main.innerHTML=F.view==='grid'
    ? '<div class="mt-grid">'+rows.map(cardHTML).join('')+'</div>'
    : '<div class="mt-list">'+rows.map(rowHTML).join('')+'</div>';
}

/* ===== 사진: 드래그앤드롭 + 자동 판독 ===== */
var PH={};   // {소재id:[사진url…]}  실제 앱에선 Firebase Storage URL
var AUTO={}; // {소재id:{color:'#..',read:[...]}}  사진에서 자동으로 알아낸 것

function bigStyle(m){var p=PH[m.id]&&PH[m.id][0];
  return p?("background:#fff url('"+p+"') center/cover no-repeat"):swatchStyle(m);}
function thumbsHTML(m){
  var ps=PH[m.id]||[],h='';
  ps.forEach(function(u,i){h+='<div style="background:#fff url(\''+u+'\') center/cover no-repeat" onclick="phFirst('+m.id+','+i+')"></div>';});
  // 사진이 없으면 지금처럼 색/조직 견본을 보여줌
  if(!ps.length)h='<div style="'+swatchStyle(m)+'"></div><div style="'+swatchStyle(m)+';filter:brightness(1.15)"></div><div style="'+swatchStyle(m)+';filter:saturate(.5)"></div>';
  return h+'<div class="dt-add" onclick="phPick('+m.id+')">＋ 사진</div>';
}
function phFirst(id,i){var a=PH[id];if(!a||!a[i])return;a.unshift(a.splice(i,1)[0]);openDetail(id);}
function dzOver(e,on){e.preventDefault();e.currentTarget.classList.toggle('over',!!on);}
function dzDrop(e,id){e.preventDefault();e.currentTarget.classList.remove('over');
  var fs=e.dataTransfer&&e.dataTransfer.files;if(fs&&fs.length)phAdd(id,fs);}
function phPick(id){
  var inp=document.getElementById('ph-file');
  if(!inp){inp=document.createElement('input');inp.type='file';inp.id='ph-file';inp.accept='image/*';inp.multiple=true;inp.style.display='none';document.body.appendChild(inp);}
  inp.onchange=function(){if(this.files&&this.files.length)phAdd(id,this.files);this.value='';};
  inp.click();
}
function phAdd(id,files){
  var arr=PH[id]=PH[id]||[],imgs=[];
  Array.prototype.forEach.call(files,function(f){if(/^image\//.test(f.type))imgs.push(URL.createObjectURL(f));});
  if(!imgs.length){alert('이미지 파일만 올릴 수 있어요');return;}
  imgs.forEach(function(u){arr.push(u);});
  // 첫 장에서 대표 색을 실제로 뽑는다 (이건 진짜 계산 — AI 없이도 항상 됨)
  pickColor(arr[0],function(hex){
    AUTO[id]={color:hex,read:true};
    openDetail(id); render();
  });
}
/* 사진 픽셀에서 대표 색 뽑기 — 가장자리(종이·배경) 빼고 가운데만 평균 */
function pickColor(url,cb){
  var im=new Image();
  im.onload=function(){
    try{
      var n=40,c=document.createElement('canvas');c.width=c.height=n;
      var x=c.getContext('2d');x.drawImage(im,0,0,n,n);
      var d=x.getImageData(Math.round(n*.25),Math.round(n*.25),Math.round(n*.5),Math.round(n*.5)).data;
      var r=0,g=0,b=0,k=0;
      for(var i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];k++;}
      var hx=function(v){v=Math.round(v/k).toString(16);return v.length<2?'0'+v:v;};
      cb('#'+hx(r)+hx(g)+hx(b));
    }catch(e){cb('#cccccc');}
  };
  im.onerror=function(){cb('#cccccc');};
  im.src=url;
}
/* 사진 올린 뒤 "무엇이 자동으로 채워졌나" 안내 */
function autoBoxHTML(id){
  var a=AUTO[id];if(!a)return '';
  return '<div class="auto-box"><b>사진에서 자동으로 채운 것</b>'
   +'<div class="auto-row"><span class="auto-sw" style="background:'+a.color+'"></span>대표 색 <b style="display:inline;font-weight:800">'+a.color+'</b> <span style="color:var(--t2)">— 목록 썸네일에 바로 반영</span></div>'
   +'<div style="margin-top:6px;color:var(--t2)">스와치에 <b>업체·품번·혼용·폭·단가</b>가 인쇄돼 있으면 글자를 읽어 같이 채웁니다. '
   +'<b>못 읽은 칸은 비워두고</b> 「확인 필요」로 표시해요 — 지어내지 않습니다.</div></div>';
}

/* ===== 상세 ===== */
function openDetail(id){
  var m=MATS.filter(function(x){return x.id===id;})[0];if(!m)return;
  var rq=m.req||{},rqb=rq.st==='got'?'<span class="rqbadge rq-got">받음 '+esc(rq.got)+'</span>':(rq.st==='no'?'<span class="rqbadge rq-no">안 옴</span>':'<span class="rqbadge rq-wait">기다리는 중</span>');
  var spec=m.kind==='fabric'
   ? [['종류','원단 · '+esc(m.org)],['혼용률',esc(m.comp)],['폭',m.width+'inch'],['중량',esc(m.weight)],['컬러 수',m.colors+'컬러'],['단가',won(m.price)+' / '+esc(m.unit)],['등록 경로',esc(m.src)]]
   : [['종류','부자재 · '+esc(m.org)],['소재',m.mat.join(', ')],['컬러 수',m.colors+'컬러'],['단가',won(m.price)+' / '+esc(m.unit)],['등록 경로',esc(m.src)]];
  document.getElementById('dt').innerHTML=''
   +'<div class="dt-hd"><b>'+esc(m.name)+'</b><span class="ut">'+STATUS[m.status]+'</span><button class="dt-x" onclick="closeDetail()">✕</button></div>'
   +'<div class="dt-bd">'
   +'<div class="dt-l">'
     +'<div class="dz" id="dz" ondragover="dzOver(event,1)" ondragleave="dzOver(event,0)" ondrop="dzDrop(event,'+m.id+')">'
       +'<div class="dt-big" style="'+bigStyle(m)+'"></div>'
       +'<div class="dt-thumbs">'+thumbsHTML(m)+'</div>'
     +'</div>'
     +'<div class="dz-hint">사진을 여기로 끌어다 놓거나 ＋사진을 누르세요</div>'
     +autoBoxHTML(m.id)
     +'<div class="sec"><div class="sec-t">실물 스와치 어디 있나</div>'
       +'<div class="kv"><label>보관 위치</label><input value="'+esc(m.swLoc)+'" placeholder="예: A바인더 12"></div>'
       +'<div class="box" style="font-size:12px">비워두면 목록에서 <b>실물 없음</b>으로 표시돼요. 필터에서 <b>가지고 있음</b>만 골라 볼 수 있어요.</div></div>'
   +'</div>'
   +'<div class="dt-r">'
     +'<div class="mc-sup" style="font-size:12.5px;margin-bottom:8px">'+esc(m.sup)+' · '+esc(m.loc)+'</div>'
     +'<table class="spec">'+spec.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>'
     +'<div class="sec"><div class="sec-t">용도</div><div class="fs-o">'+USES.map(function(u){return '<span class="fo'+(m.uses.indexOf(u)>=0?' on':'')+'">'+u+'</span>';}).join('')+'</div></div>'
     +'<div class="sec"><div class="sec-t">이 소재 쓴 아이템 <span class="auto">자동</span></div><div class="usedlist">'
       +(m.items.length?m.items.map(function(i){return '<a>'+esc(i)+'</a>';}).join(''):'<span style="font-size:12px;color:var(--t3)">아직 쓴 아이템이 없어요 (수배만 한 소재)</span>')+'</div></div>'
     +'<div class="sec"><div class="sec-t">스와치 요청 · 수령</div><div class="box"><div class="rqrow"><b>요청 '+esc(rq.ask||'-')+'</b>'+rqb+'<button class="btn" style="margin-left:auto;font-size:11.5px;padding:5px 10px">받음으로 표시</button></div></div></div>'
     +'<div class="sec"><div class="sec-t">이슈 기록</div>'
       +(m.issues.length?m.issues.map(function(x){return '<div class="issue"><span class="w">25.07</span>'+esc(x)+'</div>';}).join(''):'<div style="font-size:12px;color:var(--t3)">기록된 이슈 없음</div>')+'</div>'
     +'<div class="sec"><div class="sec-t">장단점</div><div class="box"><b>좋은 점</b> '+esc(m.pros||'-')+'<br><b>아쉬운 점</b> '+esc(m.cons||'-')+'</div></div>'
   +'</div></div>';
  document.getElementById('dv').classList.add('on');
}
function closeDetail(){document.getElementById('dv').classList.remove('on');}
render();
</script>
</body></html>
