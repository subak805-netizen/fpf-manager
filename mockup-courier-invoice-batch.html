<!DOCTYPE html>
<html lang="ko" data-theme="retro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경기택배 송장 — 여러 곳 한 번에 (레트로)</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  @import url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css');
  :root{
    --ink:#0B0A05; --cream:#EFE8D4; --paper:#FFFCF7; --paper2:#F5F1E8;
    --green:#A5E6BA; --green-t:#E8F6EE; --blue:#B0DBF0; --blue-t:#EAF3F8;
    --yellow:#FFF6B8; --t2:#3a3528; --t3:#6b6555; --red:#c0392b;
    --gal:'Galmuri11','Pretendard Variable','Pretendard',sans-serif;
    --pre:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
    --pix:'Press Start 2P',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);padding:20px;font-family:var(--pre);letter-spacing:-.2px}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}

  .title{display:inline-block;background:#fff;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:0;padding:8px 16px;font-family:var(--gal);font-weight:900;font-size:17px;margin:0 0 6px}
  .sub{font-size:12.5px;color:var(--t2);margin:8px 0 16px;font-weight:500}
  .sub b{font-weight:800}

  /* 공통 툴바 */
  .toolbar{background:var(--paper);border:2.5px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink);padding:14px 15px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:16px}
  .tb-fg{display:flex;flex-direction:column;gap:5px}
  .tb-fg label{font-family:var(--pre);font-weight:800;font-size:11px;color:var(--ink)}
  .tb-fg input{font-family:var(--pre);font-weight:500;font-size:13px;color:var(--ink);height:34px;padding:0 10px;border:2px solid var(--ink);border-radius:0;background:#fff}
  .seg{display:flex;border:2px solid var(--ink);border-radius:0}
  .seg button{border:0;border-right:2px solid var(--ink);background:#fff;font-family:var(--gal);font-weight:700;font-size:12px;padding:8px 12px;cursor:pointer;color:var(--ink)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--ink);color:#fff}
  .nudge{display:flex;gap:7px;align-items:center;font-family:var(--gal);font-size:13px}
  .nudge input{width:52px;text-align:center}
  .spacer{flex:1 1 auto}
  .printbtn{font-family:var(--gal);font-weight:800;font-size:14px;letter-spacing:.3px;padding:11px 20px;border:2.5px solid var(--ink);border-radius:0;background:var(--green);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .printbtn:active{box-shadow:none;transform:translate(2px,2px)}
  .printbtn:disabled{background:#e6e2d8;color:var(--t3);box-shadow:2px 2px 0 #b8b2a4;cursor:default}

  .wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .cardcol{flex:1 1 430px;min-width:330px}
  .selbar{display:flex;gap:8px;align-items:center;margin-bottom:11px}
  .selbar button{font-family:var(--gal);font-weight:700;font-size:12px;padding:6px 12px;border:2px solid var(--ink);border-radius:0;background:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
  .selbar button:active{box-shadow:none;transform:translate(2px,2px)}
  .selcount{margin-left:auto;font-family:var(--gal);font-weight:700;font-size:12px;background:var(--green);border:2px solid var(--ink);padding:5px 11px;color:var(--ink)}

  /* 거래처 카드 */
  .vcard{background:var(--paper);border:2.5px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--ink);margin-bottom:12px}
  .vcard.on{background:var(--green-t);box-shadow:5px 5px 0 var(--ink)}
  .vhead{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;cursor:pointer}
  .vhead input[type=checkbox]{-webkit-appearance:none;appearance:none;width:18px;height:18px;padding:0;margin-top:1px;flex:0 0 auto;border:2px solid var(--ink);border-radius:3px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .vhead input[type=checkbox]:checked{background:var(--green)}
  .vhead input[type=checkbox]:checked::after{content:"";width:9px;height:9px;border-radius:2px;background:var(--ink)}
  .vinfo{flex:1;min-width:0}
  .vname{display:block;font-family:var(--pre);font-weight:800;font-size:14.5px;color:var(--ink)}
  .vmeta{display:block;font-family:var(--pre);font-weight:500;font-size:12px;color:var(--t3);margin-top:3px;word-break:keep-all;line-height:1.45}
  .vbody{padding:0 14px 13px 42px;display:none;flex-wrap:wrap;gap:14px 18px;align-items:center}
  .vcard.on .vbody{display:flex}
  .grp{display:flex;align-items:center;gap:8px}
  .grp .k{font-family:var(--pre);font-weight:800;font-size:11px;color:var(--ink)}
  .chip{font-family:var(--gal);font-weight:700;font-size:12px;padding:6px 12px;border:2px solid var(--ink);border-radius:0;background:#fff;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff}
  .bigo-in{font-family:var(--pre);font-weight:500;font-size:12.5px;color:var(--ink);height:32px;padding:0 10px;border:2px solid var(--ink);border-radius:0;background:#fff;width:118px}
  .bigo-in::placeholder{color:var(--t3);opacity:1}

  /* 미리보기 (송장 라벨은 실제 스티커 복제 — 레트로 아님) */
  .prevcol{flex:0 0 auto;position:sticky;top:16px}
  .prevbox{background:var(--paper);border:2.5px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink);padding:14px}
  .prevcap{font-family:var(--pre);font-size:11px;color:var(--t3);margin:0 0 10px;line-height:1.5;font-weight:500}
  .prevcap b{font-family:var(--gal);font-weight:700;color:var(--ink);background:var(--yellow);border:1.5px solid var(--ink);padding:1px 7px}
  .holder{position:relative;overflow:hidden;margin:0 auto;width:110mm;height:90mm;border:2px solid var(--ink)}
  .label{position:absolute;left:0;top:0;width:110mm;height:90mm;background:#fff;transform-origin:0 0;font-family:'Pretendard',sans-serif;letter-spacing:0}
  .label *{box-sizing:border-box}
  .guide>div,.gband,.gsend,.glogo,.gbox,.lbl,.grecv,.gfare,.fcol,.fhead,.hr{position:absolute}
  .guide>div{color:#111}
  .gband{background:#dff0e2;height:13.5mm;width:110mm;left:0;top:0}
  .gsend{background:#dff0e2;height:17mm;width:110mm;left:0;top:20mm;border-top:.35mm solid #6a8f76}
  .glogo{left:34mm;top:2.2mm;width:74mm;font-weight:800;font-size:15pt;color:#123b22;line-height:1.05}
  .glogo small{display:block;font-size:8pt;font-weight:700;letter-spacing:.06em;color:#2b5a38}
  .lbl{font-weight:800;font-size:9pt}
  .grecv{border:.7mm solid #e11;left:1.5mm;top:37mm;width:107mm;height:29mm}
  .gfare{border:.35mm solid #333;left:1.5mm;top:66mm;width:107mm;height:16mm}
  .fcol{border-left:.35mm solid #333;top:66mm;height:16mm;width:0}
  .fhead{top:67mm;font-size:8.5pt;font-weight:800;text-align:center}
  .hr{height:0;border-top:.3mm solid #eaa}
  .fill{position:absolute;left:0;top:0;width:110mm;height:90mm}
  .fill>div{position:absolute;color:#000;white-space:pre-line}

  #sheet{display:none}
  @media print{
    @page{size:110mm 90mm;margin:0}
    body>*{display:none!important}
    #sheet{display:block!important}
    #sheet .pg{page-break-after:always;position:relative;width:110mm;height:90mm;overflow:hidden}
    #sheet .label{outline:0;border:0}
  }
</style>
</head>
<body>
  <div class="title">경기택배 송장 — 여러 곳 한 번에</div>
  <p class="sub">보낼 거래처를 <b>체크</b>하고 곳마다 선불/착불·비고만 정하면, <b>체크한 만큼 한 번에</b> 인쇄돼요. (모달 없이 카드로)</p>

  <div class="toolbar">
    <div class="tb-fg"><label>날짜 (오늘 자동)</label><input id="dt"></div>
    <div class="tb-fg"><label>인쇄 방향</label>
      <div class="seg" id="rotseg">
        <button class="on" onclick="setRot(0)">가로</button>
        <button onclick="setRot(90)">세로 ↻</button>
        <button onclick="setRot(270)">세로 ↺</button>
        <button onclick="setRot(180)">뒤집기</button>
      </div>
    </div>
    <div class="tb-fg"><label>위치 미세조정 (mm)</label>
      <div class="nudge">X <input id="nx" type="number" value="0" step="0.5" onchange="upPrev()"> Y <input id="ny" type="number" value="0" step="0.5" onchange="upPrev()"></div>
    </div>
    <div class="spacer"></div>
    <button class="printbtn" id="printbtn" onclick="doPrint()">선택 0곳 인쇄</button>
  </div>

  <div class="wrap">
    <div class="cardcol">
      <div class="selbar">
        <button onclick="allChk(true)">전체 선택</button>
        <button onclick="allChk(false)">전체 해제</button>
        <span class="selcount" id="selcount">0곳 선택</span>
      </div>
      <div id="cards"></div>
    </div>

    <div class="prevcol">
      <div class="prevbox">
        <p class="prevcap">미리보기 · <b id="prevname">체크한 첫 곳</b><br>초록/빨강 = 스티커에 이미 인쇄된 부분(안내용). 실제 인쇄는 값만 나가요.</p>
        <div class="holder" id="holder"><div class="label" id="label"></div></div>
      </div>
    </div>
  </div>

  <div id="sheet"></div>

<script>
var VENDORS=[
  {name:'대성실업', cont:'김대성', phone:'053-654-3210', addr:'대구 서구 서대구로 45, 3층'},
  {name:'부산패킹', cont:'이부산', phone:'051-987-6543', addr:'부산 사상구 학감대로 22'},
  {name:'경남봉제', cont:'박경남', phone:'055-222-3333', addr:'경남 김해시 삼안로 100, 2동 1층'},
  {name:'대구자수', cont:'최자수', phone:'053-421-8080', addr:'대구 중구 달구벌대로 200'},
  {name:'광주완성', cont:'정완성', phone:'062-511-7788', addr:'광주 북구 무등로 55'},
  {name:'울산워싱', cont:'한워싱', phone:'052-333-1212', addr:'울산 남구 삼산로 90'}
];
var ST=VENDORS.map(function(){return {chk:false, fare:'seon', bigo:''};});
var ROT=0;
var FILL={date:{x:4,y:4.4,size:9.5,w:25},name:{x:12,y:39.5,size:13,bold:1,w:46},cont:{x:75,y:40,size:9.5,w:32},phone:{x:12,y:49,size:11,w:94},addr:{x:12,y:58,size:9,w:95,lh:1.2},fare:{y:74,size:15,bold:1,w:19,center:1},bigo:{x:81,y:73.5,size:10,w:26,center:1,lh:1.15}};
var FAREX={seon:11,chak:30};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function todayKo(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'. '+p(d.getMonth()+1)+'. '+p(d.getDate())+'.';}

function frameHTML(){
  return '<div class="guide">'
  +'<div class="gband"></div>'
  +'<div class="gbox" style="left:2mm;top:1.5mm;width:29mm;height:11.5mm;border:.35mm solid #2b5a38;background:#fff"></div>'
  +'<div class="glogo">서울경기특송(경기택배)<small>Seoul Kyunggi Express</small></div>'
  +'<div class="gbox" style="left:5mm;top:15mm;width:104mm;font-size:7.8pt;font-weight:700;white-space:nowrap">[서울] 1588-8170 &nbsp;[경기] 031-865-0546 &nbsp;[대구] 053-588-0546 <b style="color:#c00">[부산배송]</b></div>'
  +'<div class="gsend"></div>'
  +'<div class="lbl" style="left:2mm;top:22.4mm">발신</div><div class="lbl" style="left:2mm;top:30mm">주소</div>'
  +'<div class="gbox" style="left:11mm;top:21.2mm;font-size:12pt;font-weight:800">포애<span style="font-size:9pt;font-weight:700">&nbsp;&nbsp;담당 : 박수빈</span></div>'
  +'<div class="gbox" style="left:11mm;top:29mm;width:97mm;font-size:8.4pt;line-height:1.25">010-7642-0805 강서구 공항대로213, 보타닉파크 2차 910호 (마곡동774-2)</div>'
  +'<div class="grecv"></div>'
  +'<div class="lbl" style="left:3mm;top:40.5mm">수신</div><div class="lbl" style="left:3mm;top:49.5mm">전화</div><div class="lbl" style="left:3mm;top:58.5mm">주소</div>'
  +'<div class="gbox" style="left:62mm;top:39.4mm;font-size:9pt;font-weight:700">담당 :</div>'
  +'<div class="hr" style="left:1.5mm;top:47mm;width:107mm"></div><div class="hr" style="left:1.5mm;top:56mm;width:107mm"></div>'
  +'<div class="gfare"></div><div class="lbl" style="left:2.5mm;top:72mm">운임</div>'
  +'<div class="fcol" style="left:11mm"></div><div class="fcol" style="left:30mm"></div><div class="fcol" style="left:49mm"></div><div class="fcol" style="left:80mm"></div>'
  +'<div class="fhead" style="left:11mm;width:19mm">선 불</div><div class="fhead" style="left:30mm;width:19mm">착 불</div><div class="fhead" style="left:49mm;width:31mm">물품수량</div><div class="fhead" style="left:80mm;width:28mm">비 고</div>'
  +'<div class="gbox" style="left:2mm;top:82.8mm;font-size:8pt;font-weight:700;color:#333">3자 청구</div>'
  +'</div>';
}
function cell(f,txt){if(txt==null||txt==='')return '';var s='position:absolute;left:'+f.x+'mm;top:'+f.y+'mm;width:'+(f.w||40)+'mm;font-size:'+f.size+'pt;font-weight:'+(f.bold?800:500)+';line-height:'+(f.lh||1.1)+';'+(f.center?'text-align:center;':'');return '<div style="'+s+'">'+esc(txt)+'</div>';}
function fillHTML(v,st){
  var h='';h+=cell(FILL.date,$('dt').value);h+=cell(FILL.name,v.name);h+=cell(FILL.cont,v.cont);h+=cell(FILL.phone,v.phone);h+=cell(FILL.addr,v.addr);
  var fx={};for(var k in FILL.fare)fx[k]=FILL.fare[k];fx.x=FAREX[st.fare]||11;h+=cell(fx,'O');
  h+=cell(FILL.bigo,st.bigo);return h;
}
function rotCss(){if(ROT===90)return 'translateX(90mm) rotate(90deg)';if(ROT===270)return 'translateY(110mm) rotate(-90deg)';if(ROT===180)return 'translate(110mm,90mm) rotate(180deg)';return '';}

function renderCards(){
  $('cards').innerHTML=VENDORS.map(function(v,i){
    var st=ST[i];
    return '<div class="vcard'+(st.chk?' on':'')+'" data-i="'+i+'">'
      +'<label class="vhead"><input type="checkbox" '+(st.chk?'checked':'')+' onchange="toggleChk('+i+',this.checked)">'
      +'<span class="vinfo"><span class="vname">'+esc(v.name)+'</span><span class="vmeta">'+esc([v.cont,v.phone].filter(Boolean).join(' · '))+'<br>'+esc(v.addr||'주소 없음')+'</span></span></label>'
      +'<div class="vbody">'
        +'<div class="grp"><span class="k">운임</span><div class="seg"><button class="'+(st.fare==='seon'?'on':'')+'" onclick="setFare('+i+',\'seon\')">선불</button><button class="'+(st.fare==='chak'?'on':'')+'" onclick="setFare('+i+',\'chak\')">착불</button></div></div>'
        +'<div class="grp"><span class="k">비고</span>'
          +['샘플','메인','수선'].map(function(t){return '<span class="chip'+(st.bigo===t?' on':'')+'" onclick="setBigo('+i+',\''+t+'\')">'+t+'</span>';}).join('')
          +'<input class="bigo-in" placeholder="직접" value="'+esc(st.bigo)+'" oninput="setBigoRaw('+i+',this.value)"></div>'
      +'</div></div>';
  }).join('');
}
function firstChecked(){for(var i=0;i<ST.length;i++)if(ST[i].chk)return i;return -1;}
function upPrev(){
  var i=firstChecked(),lab=$('label'),hold=$('holder'),p=(ROT===90||ROT===270);
  hold.style.width=p?'90mm':'110mm';hold.style.height=p?'110mm':'90mm';
  lab.style.transform=rotCss();
  if(i<0){$('prevname').textContent='체크한 곳 없음';lab.innerHTML=frameHTML();return;}
  $('prevname').textContent=VENDORS[i].name;
  lab.innerHTML=frameHTML()+'<div class="fill" style="transform:translate('+(parseFloat($('nx').value)||0)+'mm,'+(parseFloat($('ny').value)||0)+'mm)">'+fillHTML(VENDORS[i],ST[i])+'</div>';
}
function upCount(){var n=ST.filter(function(s){return s.chk;}).length;$('selcount').textContent=n+'곳 선택';var b=$('printbtn');b.textContent='선택 '+n+'곳 인쇄';b.disabled=n===0;}
function toggleChk(i,on){ST[i].chk=on;document.querySelector('.vcard[data-i="'+i+'"]').classList.toggle('on',on);upCount();upPrev();}
function allChk(on){ST.forEach(function(s){s.chk=on;});renderCards();upCount();upPrev();}
function setFare(i,f){ST[i].fare=f;renderCards();upPrev();}
function setBigo(i,t){ST[i].bigo=(ST[i].bigo===t?'':t);renderCards();upPrev();}
function setBigoRaw(i,v){ST[i].bigo=v;var chips=document.querySelectorAll('.vcard[data-i="'+i+'"] .chip');[].forEach.call(chips,function(c){c.classList.toggle('on',c.textContent===v);});upPrev();}
function setRot(r){ROT=r;[].forEach.call(document.querySelectorAll('#rotseg button'),function(b,idx){b.classList.toggle('on',[0,90,270,180][idx]===r);});upPrev();}

function doPrint(){
  var picks=[];ST.forEach(function(s,i){if(s.chk)picks.push(i);});
  if(!picks.length)return;
  var nx=parseFloat($('nx').value)||0,ny=parseFloat($('ny').value)||0,tr=rotCss();
  $('sheet').innerHTML=picks.map(function(i){
    return '<div class="pg"><div class="label" style="transform-origin:0 0;'+(tr?'transform:'+tr+';':'')+'">'
      +frameHTML()+'<div class="fill" style="transform:translate('+nx+'mm,'+ny+'mm)">'+fillHTML(VENDORS[i],ST[i])+'</div></div></div>';
  }).join('');
  window.print();
}

$('dt').value=todayKo();
renderCards();upCount();upPrev();
</script>
</body>
</html>
